<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090a" />
  <meta name="description" content="NoxCipher Tools: small browser tools for SOC work. CEF parser, time converter, CIDR calculator, JWT decoder, encoder. Everything runs locally." />
  <title>NoxCipher Tools</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A//www.w3.org/2000/svg'%20viewBox%3D'0%200%2048%2048'%3E%3Crect%20width%3D'48'%20height%3D'48'%20rx%3D'10'%20fill%3D'%2308090a'/%3E%3Cdefs%3E%3Cpath%20id%3D'n'%20d%3D'M10%208H16L32%2030V8H38V40H32L16%2018V40H10Z'/%3E%3CclipPath%20id%3D'a'%3E%3Crect%20width%3D'48'%20height%3D'18'/%3E%3C/clipPath%3E%3CclipPath%20id%3D'b'%3E%3Crect%20y%3D'20'%20width%3D'48'%20height%3D'8'/%3E%3C/clipPath%3E%3CclipPath%20id%3D'c'%3E%3Crect%20y%3D'30'%20width%3D'48'%20height%3D'18'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg%20clip-path%3D'url(%23a)'%3E%3Cuse%20href%3D'%23n'%20fill%3D'%23EDEDEA'/%3E%3C/g%3E%3Cg%20clip-path%3D'url(%23b)'%3E%3Cuse%20href%3D'%23n'%20fill%3D'%233DFFA2'%20transform%3D'translate(3%200)'/%3E%3C/g%3E%3Cg%20clip-path%3D'url(%23c)'%3E%3Cuse%20href%3D'%23n'%20fill%3D'%23EDEDEA'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #08090a; --surface: #0e1011; --surface-2: #131617; --code: #060707;
      --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
      --text: #ededea; --muted: #8b9094; --faint: #5b6064;
      --accent: #3dffa2; --accent-dim: rgba(61,255,162,.10);
      --warn: #ffb547; --danger: #ff6b6b; --info: #7fb8ff;
      --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
      background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px); background-size: 28px 28px;
      mask-image: radial-gradient(ellipse 80% 50% at 50% 0%, #000 30%, transparent 75%);
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; color: inherit; }
    ::selection { background: var(--accent); color: #04140b; }
    .wrap { width: min(1240px, calc(100% - 32px)); margin: 0 auto; }
    .label { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    svg.i { width: 16px; height: 16px; flex: none; }

    header { position: sticky; top: 0; z-index: 40; background: rgba(8,9,10,.85); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .nav { height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .logo { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
    .logo svg { width: 28px; height: 28px; color: var(--text); flex: none; }
    .logo-word { font: 600 16px var(--sans); letter-spacing: -.01em; white-space: nowrap; }
    .logo-word span { color: var(--muted); font-weight: 500; }
    .logo-sub { font: 500 14px var(--mono); color: var(--accent); white-space: nowrap; }
    .nav-right { display: flex; gap: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; font: 500 13px var(--sans); cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
    .btn:hover { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.24); }
    .btn.solid { background: var(--accent); border-color: var(--accent); color: #04140b; font-weight: 600; }
    .btn.solid:hover { background: #6bffbb; }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }

    .hero { padding: 44px 0 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
    h1 { margin: 12px 0 10px; font-size: clamp(2.2rem, 4.6vw, 3.4rem); font-weight: 600; letter-spacing: -.045em; line-height: 1; }
    h1 .dot { color: var(--accent); }
    .lede { margin: 0; color: var(--muted); font-size: 16px; max-width: 560px; }
    .local { display: inline-flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--accent); border: 1px solid rgba(61,255,162,.25); background: var(--accent-dim); padding: 6px 10px; border-radius: 8px; }
    .local svg { width: 14px; height: 14px; }

    .shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 20px; padding: 4px 0 56px; align-items: start; }
    .side { position: sticky; top: 80px; display: grid; gap: 4px; }
    .tool-btn { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; text-align: left; padding: 10px; border-radius: 10px; border: 1px solid transparent; background: none; cursor: pointer; transition: background .12s, border-color .12s; }
    .tool-btn:hover { background: rgba(255,255,255,.03); }
    .tool-btn[aria-selected="true"] { background: var(--surface); border-color: var(--line-2); }
    .tool-btn .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
    .tool-btn .ico svg { width: 17px; height: 17px; }
    .tool-btn[aria-selected="true"] .ico { color: var(--accent); border-color: rgba(61,255,162,.25); background: var(--accent-dim); }
    .tool-btn b { display: block; font-size: 14px; font-weight: 500; }
    .tool-btn small { display: block; font-size: 12px; color: var(--faint); line-height: 1.35; }
    .side-note { margin-top: 12px; padding: 12px; border-radius: 10px; border: 1px dashed var(--line-2); font-size: 12.5px; color: var(--faint); }

    .work { border: 1px solid var(--line-2); border-radius: 14px; background: var(--surface); min-width: 0; }
    .w-head { padding: 20px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    .w-head h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
    .w-head p { margin: 0; color: var(--muted); font-size: 14px; max-width: 620px; }
    .w-sec { padding: 20px 24px; border-bottom: 1px solid var(--line); }
    .w-sec:last-child { border-bottom: 0; }
    .w-sec h3 { margin: 0 0 12px; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; text-transform: none; letter-spacing: 0; }

    textarea, .inp, select { width: 100%; border: 1px solid var(--line-2); background: var(--code); border-radius: 10px; outline: none; font: 400 13px/1.6 var(--mono); color: #d6d9d6; }
    textarea { padding: 12px 14px; resize: vertical; min-height: 110px; }
    .inp { height: 40px; padding: 0 12px; }
    select { height: 40px; padding: 0 10px; font-family: var(--sans); font-size: 13px; background: var(--surface-2); }
    textarea:focus, .inp:focus, select:focus { border-color: rgba(61,255,162,.5); box-shadow: 0 0 0 3px rgba(61,255,162,.07); }
    textarea::placeholder, .inp::placeholder { color: var(--faint); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid2 > *, .enc-grid > * { min-width: 0; }
    .field label { display: block; font: 500 12px var(--mono); color: var(--muted); margin-bottom: 6px; }

    .err { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,107,107,.25); background: rgba(255,107,107,.06); color: #ffb3b3; font-size: 13.5px; }
    .info { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(127,184,255,.2); background: rgba(127,184,255,.05); color: var(--muted); font-size: 13.5px; }
    .info b, .err b { color: var(--text); font-weight: 500; }
    .placeholder { color: var(--faint); font-size: 14px; padding: 8px 0; }

    .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--mono); padding: 4px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
    .pill b { color: var(--text); font-weight: 500; }
    .pill.g { color: var(--accent); border-color: rgba(61,255,162,.25); background: var(--accent-dim); }
    .pill.w { color: var(--warn); border-color: rgba(255,181,71,.25); background: rgba(255,181,71,.07); }
    .pill.r { color: #ff8a8a; border-color: rgba(255,107,107,.25); background: rgba(255,107,107,.07); }
    .pill.b { color: var(--info); border-color: rgba(127,184,255,.25); background: rgba(127,184,255,.07); }

    .kv { width: 100%; border-collapse: collapse; font-size: 13px; }
    .kv th { text-align: left; font: 500 11px var(--mono); color: var(--faint); letter-spacing: .06em; text-transform: uppercase; padding: 0 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .kv td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .kv tr:last-child td { border-bottom: 0; }
    .kv td.k { font: 500 12.5px var(--mono); color: var(--muted); white-space: nowrap; width: 1%; }
    .kv td.v { font: 400 12.5px var(--mono); color: var(--text); word-break: break-all; }
    .kv td.c { font: 500 12.5px var(--mono); color: var(--accent); white-space: nowrap; }
    .kv td.c.dim { color: var(--faint); }
    .kv td.d { color: var(--faint); font-size: 12.5px; }
    .kv tr.hdr td.k { color: var(--info); }
    .tbl-wrap { overflow-x: auto; }
    .copyable { cursor: pointer; border-radius: 5px; transition: background .12s; }
    .copyable:hover { background: rgba(61,255,162,.07); }
    .copyable:hover::after { content: " ⧉"; color: var(--accent); font-size: 11px; }

    pre.code { margin: 0; padding: 14px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--code); font: 400 12.5px/1.7 var(--mono); color: #c9cdc9; overflow-x: auto; white-space: pre; }
    pre.code.wrap-text { white-space: pre-wrap; word-break: break-all; }
    .k { color: #7fb8ff; } .s { color: #e6c07b; } .n { color: #f78c6c; } .t { color: var(--accent); } .cm { color: var(--faint); } .key { color: #c3a6ff; }

    .bits { display: grid; grid-template-columns: repeat(32, 1fr); gap: 2px; margin: 4px 0 6px; }
    .bits i { height: 22px; border-radius: 3px; background: rgba(255,255,255,.07); display: grid; place-items: center; font: 500 9px var(--mono); color: var(--faint); font-style: normal; }
    .bits i.on { background: rgba(61,255,162,.22); color: var(--accent); }
    .bits i.sep { margin-right: 4px; }
    .bits-legend { display: flex; justify-content: space-between; font: 500 11px var(--mono); color: var(--faint); }

    .jwt-raw { font: 400 12.5px/1.7 var(--mono); word-break: break-all; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--code); }
    .jwt-raw .h { color: #ff8a8a; } .jwt-raw .p { color: #c3a6ff; } .jwt-raw .sg { color: var(--info); } .jwt-raw .dot { color: var(--muted); }

    .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; padding: 2px; background: var(--bg); flex-wrap: wrap; }
    .seg button { border: 0; background: none; height: 28px; padding: 0 10px; border-radius: 6px; font: 500 12.5px var(--sans); color: var(--muted); cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }
    .enc-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
    .swap { align-self: center; width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface-2); cursor: pointer; display: grid; place-items: center; color: var(--muted); }
    .swap:hover { color: var(--accent); }
    .enc-grid textarea { min-height: 180px; }
    .hint-line { margin-top: 10px; font-size: 12.5px; color: var(--faint); min-height: 1.4em; }
    .hint-line.warn { color: var(--warn); }


    /* AMA planner */
    .plan-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }
    .plan-grid.inputs { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line-2); grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .plan-grid > * { min-width: 0; }
    .chks { display: grid; gap: 7px; }
    .field label.chk, .chk { display: inline-flex; align-items: center; gap: 8px; font: 400 13.5px var(--sans); color: #c3c7c5; cursor: pointer; margin: 0; }
    .chk input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; flex: none; }
    .field .cm { color: var(--faint); font-weight: 400; }
    .route-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .route-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: #0b0d0e; }
    .route-card h4 { margin: 0 0 10px; font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .route-card ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13.5px; display: grid; gap: 4px; }
    .route-card p { margin: 0; color: var(--faint); font-size: 13px; }
    .route-card.empty { opacity: .6; }
    .dot-g, .dot-b, .dot-w { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot-g { background: var(--accent); box-shadow: 0 0 8px var(--accent); } .dot-b { background: var(--info); } .dot-w { background: var(--warn); }
    .kv tr.grp td { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding-top: 14px; background: none; }
    .kv .pill { white-space: nowrap; font-size: 11px; padding: 2px 7px; }
    .tags-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
    .tagcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #0b0d0e; display: grid; gap: 3px; }
    .tagcard code { font: 500 13px var(--mono); color: var(--accent); justify-self: start; }
    .tagcard span { font-size: 12.5px; color: var(--faint); }
    .tagcard.dim { opacity: .5; }
    .olist { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 10px; }
    .olist li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 10px; font-size: 14px; color: #c3c7c5; }
    .olist li::before { content: counter(s); font: 500 11.5px/22px var(--mono); text-align: center; width: 22px; height: 22px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line-2); color: var(--muted); }
    .olist code, .gotchas code, .info code { font: 500 12px var(--mono); color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
    .olist b, .gotchas b { color: var(--text); font-weight: 500; }
    .cmd-block + .cmd-block { margin-top: 12px; }
    .cmd-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
    .gotchas { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
    .gotchas li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 14px; color: var(--muted); }
    .gotchas li::before { content: "!"; font: 600 11px/18px var(--mono); text-align: center; width: 18px; height: 18px; border-radius: 50%; color: var(--warn); border: 1px solid rgba(255,181,71,.35); background: rgba(255,181,71,.07); }

    /* DCR builder */
    .src-list { display: grid; gap: 10px; }
    .src-card { border: 1px solid var(--line); border-radius: 12px; background: #0b0d0e; transition: border-color .15s; }
    .src-card.on { border-color: rgba(61,255,162,.3); }
    .src-head { display: grid; grid-template-columns: 18px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; cursor: pointer; }
    .src-head input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
    .src-head b { display: block; font-size: 14px; font-weight: 600; }
    .src-head small { display: block; font-size: 12.5px; color: var(--faint); }
    .src-head code { font: 500 11.5px var(--mono); color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 7px; white-space: nowrap; }
    .src-card.on .src-head code { color: var(--accent); border-color: rgba(61,255,162,.25); background: var(--accent-dim); }
    .src-body { display: none; padding: 4px 14px 16px 44px; gap: 12px; }
    .src-card.on .src-body { display: grid; }
    .chk-row { display: flex; flex-wrap: wrap; gap: 6px 16px; }
    .field label.chk.sm, .chk.sm { font: 400 12.5px var(--mono); color: var(--muted); }
    .src-body select, .vendor select { max-width: 220px; }
    .notes { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
    .notes li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 13.5px; color: var(--muted); }
    .notes li::before { content: "i"; font: 600 11px/18px var(--mono); text-align: center; width: 18px; height: 18px; border-radius: 50%; color: var(--info); border: 1px solid rgba(127,184,255,.35); background: rgba(127,184,255,.07); }
    .notes code { font: 500 12px var(--mono); color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
    .notes b { color: var(--text); font-weight: 500; }
    .gotchas + .notes { margin-top: 12px; }
    /* Firewall builder */
    .vendor-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .vendor { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: #0b0d0e; display: grid; gap: 10px; align-content: start; min-width: 0; }
    .vendor h4 { margin: 0; font-size: 13.5px; font-weight: 600; }
    .vendor .inp { height: 36px; }
    .vendor-out h3 .sub { text-transform: none; letter-spacing: 0; color: var(--faint); font-family: var(--sans); font-size: 12.5px; margin-left: 6px; }
    .vendor-out h3 > span:first-child { color: var(--text); font: 600 14px var(--sans); letter-spacing: 0; text-transform: none; }
    details.test { margin-top: 10px; }
    details.test summary { cursor: pointer; font-size: 13px; color: var(--muted); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
    details.test summary::before { content: "▸"; color: var(--accent); transition: transform .15s; }
    details.test[open] summary::before { transform: rotate(90deg); }
    details.test summary::-webkit-details-marker { display: none; }
    footer { border-top: 1px solid var(--line); padding: 24px 0 36px; }
    .foot { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--faint); }
    .foot a:hover { color: var(--text); }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--surface-2); border: 1px solid rgba(61,255,162,.35); padding: 10px 16px; border-radius: 10px; font: 500 13px var(--sans); box-shadow: 0 20px 40px rgba(0,0,0,.5); transition: opacity .2s, transform .2s; z-index: 80; max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast b { color: var(--accent); font-weight: 500; }

    @media (max-width: 900px) {
      .shell { grid-template-columns: minmax(0, 1fr); }
      .side { position: static; display: flex; overflow-x: auto; gap: 6px; scrollbar-width: none; }
      .side::-webkit-scrollbar { display: none; }
      .tool-btn { grid-template-columns: 26px auto; padding: 6px 12px 6px 6px; border-color: var(--line); flex: none; }
      .tool-btn .ico { width: 26px; height: 26px; border-radius: 7px; }
      .tool-btn .ico svg { width: 14px; height: 14px; }
      .tool-btn small, .side-note { display: none; }
      .tool-btn b { font-size: 13px; white-space: nowrap; }
      .w-head, .w-sec { padding-left: 16px; padding-right: 16px; }
      .grid2 { grid-template-columns: 1fr; }
      .enc-grid { grid-template-columns: 1fr; }
      .plan-grid, .plan-grid.inputs, .route-split { grid-template-columns: minmax(0, 1fr); }
      .vendor-grid { grid-template-columns: minmax(0, 1fr); }
      .src-body { padding-left: 14px; }
      .src-head { grid-template-columns: 18px 1fr; }

      .swap { justify-self: center; transform: rotate(90deg); }
      .hide-sm { display: none; }
      .bits i { font-size: 0; height: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    const $ = (s, r = document) => r.querySelector(s);
    const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    document.getElementById('year').textContent = new Date().getFullYear();

    /* ---------- copy ---------- */
    const toast = $('#toast'); let tt;
    async function copy(text, label = 'value') {
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; }
      catch { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand('copy'); } catch {} ta.remove(); }
      toast.innerHTML = ok ? `<b>Copied</b>&nbsp; ${esc(label)}` : 'Copy blocked by the browser';
      toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 1600);
    }
    document.addEventListener('click', e => {
      const c = e.target.closest('[data-copy]'); if (c) copy(c.dataset.copy, c.dataset.label || c.dataset.copy.slice(0, 48));
    });
    const cp = (v, label) => `data-copy="${esc(v)}" data-label="${esc(label || v)}" class="copyable"`;

    /* tiny KQL highlighter */
    function kql(src) {
      const KW = /\b(where|project|summarize|extend|by|and|or|in|ago|count|datetime|ipv4_is_in_range|ipv4_is_private|between|has|contains)\b/g;
      return src.split('\n').map(line => {
        let cmt = ''; const ci = line.indexOf('//');
        if (ci > -1) { cmt = line.slice(ci); line = line.slice(0, ci); }
        if (/^\s*[A-Z]\w+\s*$/.test(line)) return `<span class="t">${esc(line)}</span>`;
        const body = line.split(/("[^"]*")/).map((p, i) => i % 2 ? `<span class="s">${esc(p)}</span>`
          : esc(p).replace(KW, '<span class="k">$1</span>').replace(/\b(\d+[hdm]?)\b/g, '<span class="n">$1</span>')).join('');
        return body + (cmt ? `<span class="cm">${esc(cmt)}</span>` : '');
      }).join('\n');
    }
    const kqlBlock = src => `<div class="w-sec"><h3><span>KQL</span><span class="row-actions"><button class="btn sm" data-copy="${esc(src)}" data-label="KQL query">Copy query</button></span></h3><pre class="code">${kql(src)}</pre></div>`;

    /* =========================================================
       1. CEF parser
       ========================================================= */
    const CEF_HEADER = [
      ['Version', null],
      ['Device Vendor', 'DeviceVendor'],
      ['Device Product', 'DeviceProduct'],
      ['Device Version', 'DeviceVersion'],
      ['Signature ID', 'DeviceEventClassID'],
      ['Name', 'Activity'],
      ['Severity', 'LogSeverity']
    ];
    const CEF_MAP = {
      act: 'DeviceAction', app: 'ApplicationProtocol', cat: 'DeviceEventCategory', cnt: 'EventCount',
      dhost: 'DestinationHostName', dmac: 'DestinationMACAddress', dntdom: 'DestinationNTDomain', dpt: 'DestinationPort',
      dpid: 'DestinationProcessId', dproc: 'DestinationProcessName', dst: 'DestinationIP', duid: 'DestinationUserID', duser: 'DestinationUserName',
      deviceExternalId: 'DeviceExternalID', deviceInboundInterface: 'DeviceInboundInterface', deviceOutboundInterface: 'DeviceOutboundInterface',
      dvc: 'DeviceAddress', dvchost: 'DeviceName', dvcmac: 'DeviceMacAddress', deviceDirection: 'CommunicationDirection',
      end: 'EndTime', start: 'StartTime', rt: 'ReceiptTime', externalId: 'ExternalID',
      fname: 'FileName', fsize: 'FileSize', filePath: 'FilePath', fileHash: 'FileHash',
      in: 'ReceivedBytes', out: 'SentBytes', msg: 'Message', proto: 'Protocol', reason: 'Reason', outcome: 'EventOutcome',
      request: 'RequestURL', requestClientApplication: 'RequestClientApplication', requestContext: 'RequestContext', requestMethod: 'RequestMethod',
      shost: 'SourceHostName', smac: 'SourceMACAddress', sntdom: 'SourceNTDomain', spt: 'SourcePort', spid: 'SourceProcessId', sproc: 'SourceProcessName',
      src: 'SourceIP', suid: 'SourceUserID', suser: 'SourceUserName',
      sourceTranslatedAddress: 'SourceTranslatedAddress', sourceTranslatedPort: 'SourceTranslatedPort',
      destinationTranslatedAddress: 'DestinationTranslatedAddress', destinationTranslatedPort: 'DestinationTranslatedPort'
    };
    for (let n = 1; n <= 6; n++) { CEF_MAP['cs' + n] = 'DeviceCustomString' + n; CEF_MAP[`cs${n}Label`] = `DeviceCustomString${n}Label`; }
    for (let n = 1; n <= 3; n++) { CEF_MAP['cn' + n] = 'DeviceCustomNumber' + n; CEF_MAP[`cn${n}Label`] = `DeviceCustomNumber${n}Label`; }
    const PROTO = { 1: 'ICMP', 6: 'TCP', 17: 'UDP', 47: 'GRE', 50: 'ESP' };

    const CEF_SAMPLES = {
      'FortiGate': 'Oct 14 21:42:07 fgt-edge-01 CEF:0|Fortinet|Fortigate|v7.4.3|00013|traffic:forward deny|3|deviceExternalId=FG100FTK23000001 FTNTFGTlogid=0000000013 cat=traffic:forward FTNTFGTsubtype=forward FTNTFGTlevel=notice FTNTFGTvd=root src=192.0.2.77 spt=51522 deviceInboundInterface=wan1 FTNTFGTsrcintfrole=wan dst=10.10.20.5 dpt=3389 deviceOutboundInterface=internal FTNTFGTdstintfrole=lan proto=6 act=deny FTNTFGTpolicyid=0 FTNTFGTpolicytype=policy FTNTFGTservice=RDP FTNTFGTsrccountry=Netherlands out=0 in=0',
      'Palo Alto': 'CEF:0|Palo Alto Networks|PAN-OS|11.1.2|vulnerability|THREAT|8|rt=Oct 14 2026 18:42:10 GMT deviceExternalId=013201000001 src=192.0.2.77 dst=203.0.113.10 sourceTranslatedAddress=0.0.0.0 destinationTranslatedAddress=10.10.30.15 cs1Label=Rule cs1=dmz-web-inbound suser= duser= app=web-browsing cs3Label=Virtual System cs3=vsys1 cs4Label=Source Zone cs4=untrust cs5Label=Destination Zone cs5=dmz deviceInboundInterface=ethernet1/1 deviceOutboundInterface=ethernet1/3 cs6Label=LogProfile cs6=to-sentinel cn1Label=SessionID cn1=482913 cnt=1 spt=40122 dpt=443 sourceTranslatedPort=0 destinationTranslatedPort=443 proto=tcp act=reset-both request="Apache Log4j Remote Code Execution Vulnerability(91991)" cat=code-execution PanOSThreatCategory=code-execution',
      'Broken': 'CEF:0|Fortinet|Fortigate|v7.4.3|00013 src=192.0.2.77 dst=10.10.20.5'
    };

    function parseCef(line) {
      const at = line.indexOf('CEF:');
      if (at < 0) throw new Error('No <b>CEF:</b> marker found. Paste a full CEF line; a syslog prefix before it is fine.');
      const prefix = line.slice(0, at).trim();
      const s = line.slice(at + 4);
      const hdr = []; let cur = '', k = 0;
      for (; k < s.length && hdr.length < 7; k++) {
        const c = s[k];
        if (c === '\\' && (s[k + 1] === '|' || s[k + 1] === '\\')) { cur += s[k + 1]; k++; continue; }
        if (c === '|') { hdr.push(cur); cur = ''; continue; }
        cur += c;
      }
      if (hdr.length < 7) throw new Error(`Header is incomplete: CEF needs 7 pipe-separated fields before the extension, found <b>${hdr.length}</b>. Check for a missing <b>|</b>.`);
      const ext = s.slice(k);
      const re = /(^|\s)([A-Za-z0-9_.\-\[\]]+)=/g, keys = []; let m;
      while ((m = re.exec(ext))) keys.push({ key: m[2], at: m.index, val: re.lastIndex });
      const fields = keys.map((x, i) => {
        let v = ext.slice(x.val, i + 1 < keys.length ? keys[i + 1].at : ext.length).trim();
        v = v.replace(/\\=/g, '=').replace(/\\n/g, '\n').replace(/\\r/g, '\r').replace(/\\\\/g, '\\');
        if (/^".*"$/.test(v)) v = v.slice(1, -1);
        return [x.key, v];
      });
      return { prefix, hdr, fields };
    }
    function sevLabel(v) {
      const n = Number(v);
      if (Number.isNaN(n)) return v;
      return n <= 3 ? 'Low' : n <= 6 ? 'Medium' : n <= 8 ? 'High' : 'Very High';
    }

    function renderCef(w) {
      w.innerHTML = `
        <div class="w-head"><div><h2>CEF parser</h2><p>Paste a CEF line, with or without the syslog prefix. See every field, the CommonSecurityLog column it lands in, and a starter KQL query.</p></div></div>
        <div class="w-sec">
          <h3><span>Input</span><span class="row-actions">${Object.keys(CEF_SAMPLES).map(k => `<button class="btn sm" data-sample="${esc(k)}">${esc(k)} sample</button>`).join('')}<button class="btn sm" id="cefClear">Clear</button></span></h3>
          <textarea id="cefIn" spellcheck="false" placeholder="CEF:0|Vendor|Product|Version|SignatureID|Name|Severity|src=… dst=…"></textarea>
        </div>
        <div id="cefOut"></div>`;
      const inp = $('#cefIn', w), out = $('#cefOut', w);
      const run = () => {
        const v = inp.value.trim();
        if (!v) { out.innerHTML = `<div class="w-sec"><div class="placeholder">Paste a line or load a sample to see the breakdown.</div></div>`; return; }
        try {
          const { prefix, hdr, fields } = parseCef(v);
          const F = Object.fromEntries(fields);
          const label = n => F[`cs${n}Label`] || F[`cn${n}Label`];
          const unmapped = fields.filter(([k]) => !CEF_MAP[k]);
          const proto = F.proto ? (PROTO[F.proto] || F.proto.toUpperCase()) : '';
          const actCls = /deny|drop|block|reset|reject/i.test(F.act || '') ? 'r' : F.act ? 'g' : '';
          const sev = sevLabel(hdr[6]);
          const pills = [
            `<span class="pill b"><b>${esc(hdr[1])}</b>&nbsp;${esc(hdr[2])} ${esc(hdr[3])}</span>`,
            `<span class="pill ${/High/.test(sev) ? 'w' : ''}">Severity <b>${esc(hdr[6])}</b> (${esc(sev)})</span>`,
            F.src || F.dst ? `<span class="pill">${esc(F.src || '?')}${F.spt ? ':' + esc(F.spt) : ''} → <b>${esc(F.dst || '?')}${F.dpt ? ':' + esc(F.dpt) : ''}</b>${proto ? ' ' + esc(proto) : ''}</span>` : '',
            F.act ? `<span class="pill ${actCls}">Action <b>${esc(F.act)}</b></span>` : '',
            `<span class="pill">${fields.length} extension fields</span>`,
            unmapped.length ? `<span class="pill w">${unmapped.length} → AdditionalExtensions</span>` : ''
          ].join('');
          const hdrRows = CEF_HEADER.map(([n, col], i) => `<tr class="hdr"><td class="k">${esc(n)}</td><td class="v"><span ${cp(hdr[i], n)}>${esc(hdr[i])}</span></td><td class="c ${col ? '' : 'dim'}">${col || '(not stored)'}</td></tr>`).join('');
          const extRows = fields.map(([k, v]) => {
            let col = CEF_MAP[k];
            const num = (k.match(/^c[sn](\d)$/) || [])[1];
            const note = num && label(num) ? ` <span class="cm">(${esc(label(num))})</span>` : '';
            return `<tr><td class="k">${esc(k)}</td><td class="v">${v === '' ? '<span class="cm">empty</span>' : `<span ${cp(v, k)}>${esc(v)}</span>`}</td><td class="c ${col ? '' : 'dim'}">${col ? esc(col) + note : 'AdditionalExtensions'}</td></tr>`;
          }).join('');

          const q = ['CommonSecurityLog', '| where TimeGenerated > ago(1h)', `| where DeviceVendor == "${hdr[1]}" and DeviceProduct == "${hdr[2]}"`];
          if (F.src) q.push(`| where SourceIP == "${F.src}"`);
          if (F.dpt) q.push(`| where DestinationPort == ${Number(F.dpt) || `"${F.dpt}"`}`);
          if (F.act) q.push(`| where DeviceAction == "${F.act}"`);
          q.push('| project TimeGenerated, Activity, SourceIP, SourcePort, DestinationIP, DestinationPort, DeviceAction, AdditionalExtensions');

          out.innerHTML = `
            <div class="w-sec">
              <h3><span>Breakdown</span><span class="row-actions" style="color:var(--faint)">Click any value to copy it</span></h3>
              <div class="summary">${pills}</div>
              ${prefix ? `<div class="info" style="margin-bottom:14px"><span><b>Syslog prefix detected:</b> <code>${esc(prefix)}</code>. The forwarder strips this; it isn't part of the CEF payload.</span></div>` : ''}
              <div class="tbl-wrap"><table class="kv"><thead><tr><th>Field</th><th>Value</th><th>CommonSecurityLog column</th></tr></thead><tbody>${hdrRows}${extRows}</tbody></table></div>
            </div>
            ${kqlBlock(q.join('\n'))}`;
        } catch (e) {
          out.innerHTML = `<div class="w-sec"><div class="err"><svg class="i"><use href="#i-warn"/></svg><span>${e.message}</span></div></div>`;
        }
      };
      inp.addEventListener('input', run);
      w.addEventListener('click', e => {
        const b = e.target.closest('[data-sample]'); if (b) { inp.value = CEF_SAMPLES[b.dataset.sample]; run(); }
        if (e.target.closest('#cefClear')) { inp.value = ''; run(); inp.focus(); }
      });
      inp.value = CEF_SAMPLES['FortiGate']; run();
    }

    /* =========================================================
       2. Time converter
       ========================================================= */
    const ZONES = ['Asia/Qatar', 'UTC', 'Europe/London', 'Europe/Berlin', 'Asia/Dubai', 'Asia/Kolkata', 'Asia/Singapore', 'America/New_York', 'America/Los_Angeles', 'Australia/Sydney'];
    function parseTime(raw) {
      let v = raw.trim().replace(/^datetime\((.*)\)$/i, '$1').replace(/^["']|["']$/g, '');
      if (!v) return null;
      if (/^now$/i.test(v)) return { d: new Date(), how: 'Current time' };
      if (/^-?\d+(\.\d+)?$/.test(v)) {
        const digits = v.split('.')[0].replace('-', '').length;
        if (digits <= 10) return { d: new Date(parseFloat(v) * 1000), how: 'Unix epoch (seconds)' };
        if (digits <= 13) return { d: new Date(parseFloat(v)), how: 'Unix epoch (milliseconds)' };
        if (digits <= 16) return { d: new Date(parseFloat(v) / 1000), how: 'Unix epoch (microseconds)' };
        if (digits <= 18) { const ms = Number(BigInt(v.split('.')[0]) / 10000n) - 11644473600000; return { d: new Date(ms), how: 'Windows FILETIME (100 ns since 1601)' }; }
        return { d: new Date(Number(BigInt(v.split('.')[0]) / 1000000n)), how: 'Unix epoch (nanoseconds)' };
      }
      const d = new Date(v);
      if (!isNaN(d)) return { d, how: /Z$|[+-]\d\d:?\d\d$|GMT|UTC/i.test(v) ? 'Date string with timezone' : 'Date string (read as your local time)' };
      return { err: true };
    }
    function fmtZone(d, tz) {
      const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZoneName: 'shortOffset' }).formatToParts(d).map(x => [x.type, x.value]));
      return `${p.year}-${p.month}-${p.day} ${p.hour === '24' ? '00' : p.hour}:${p.minute}:${p.second} ${p.timeZoneName || ''}`.trim();
    }
    function relative(d) {
      const s = Math.round((d - Date.now()) / 1000), a = Math.abs(s);
      const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });
      if (a < 60) return rtf.format(s, 'second');
      if (a < 3600) return rtf.format(Math.round(s / 60), 'minute');
      if (a < 86400) return rtf.format(Math.round(s / 3600), 'hour');
      if (a < 86400 * 45) return rtf.format(Math.round(s / 86400), 'day');
      if (a < 86400 * 365) return rtf.format(Math.round(s / 86400 / 30), 'month');
      return rtf.format(Math.round(s / 86400 / 365), 'year');
    }
    function renderTime(w) {
      const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
      w.innerHTML = `
        <div class="w-head"><div><h2>Time converter</h2><p>Paste anything time-shaped: epoch seconds or milliseconds, ISO 8601, a syslog date, Windows FILETIME, or a KQL <code>datetime()</code>. The format is detected automatically.</p></div></div>
        <div class="w-sec">
          <div class="grid2">
            <div class="field"><label for="tIn">Input</label><input class="inp" id="tIn" spellcheck="false" placeholder="1792003330, 2026-10-14T18:42:10Z, Oct 14 2026 18:42:10 GMT"/></div>
            <div class="field"><label for="tZone">Extra timezone</label><select id="tZone">${ZONES.map(z => `<option ${z === 'Asia/Qatar' ? 'selected' : ''}>${z}</option>`).join('')}</select></div>
          </div>
          <div class="row-actions" style="margin-top:10px">
            <button class="btn sm" data-t="now">Now</button>

    /* =========================================================
       3. CIDR calculator
       ========================================================= */
    const ipToInt = ip => { const p = ip.split('.'); if (p.length !== 4 || p.some(x => !/^\d{1,3}$/.test(x) || +x > 255)) return null; return ((+p[0] << 24) >>> 0) + (+p[1] << 16) + (+p[2] << 8) + +p[3]; };

    const RANGES = [
      ['10.0.0.0/8', 'Private (RFC 1918)'], ['172.16.0.0/12', 'Private (RFC 1918)'], ['192.168.0.0/16', 'Private (RFC 1918)'],

      ['192.0.2.0/24', 'Documentation (TEST-NET-1)'], ['198.51.100.0/24', 'Documentation (TEST-NET-2)'], ['203.0.113.0/24', 'Documentation (TEST-NET-3)'],
      ['224.0.0.0/4', 'Multicast'], ['0.0.0.0/8', '"This network"'], ['240.0.0.0/4', 'Reserved']
    ];
    const inRange = (n, cidr) => { const [b, p] = cidr.split('/'); const m = +p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0; return ((n & m) >>> 0) === ((ipToInt(b) & m) >>> 0); };
    function renderCidr(w) {
      w.innerHTML = `

            <div class="field"><label for="cIn">Network (CIDR)</label><input class="inp" id="cIn" spellcheck="false" placeholder="10.10.20.0/22"/></div>
            <div class="field"><label for="cChk">Check an IP (optional)</label><input class="inp" id="cChk" spellcheck="false" placeholder="10.10.23.14"/></div>
          </div>
          <div class="row-actions" style="margin-top:10px">${['10.10.20.0/22', '192.168.1.130/26', '172.16.0.0/12', '203.0.113.7/32'].map(x => `<button class="btn sm" data-c="${x}">${x}</button>`).join('')}</div>

        const mask = p === 0 ? 0 : (0xFFFFFFFF << (32 - p)) >>> 0, net = (ip & mask) >>> 0, bc = (net | (~mask >>> 0)) >>> 0;

    function renderJwt(w) {
