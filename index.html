                <label class="chk" data-show="arc-private"><input type="checkbox" data-c="ampls" ${st.ampls ? 'checked' : ''}/> Azure Monitor Private Link Scope</label>
                <label class="chk"><input type="checkbox" data-c="proxy" ${st.proxy ? 'checked' : ''}/> Outbound goes through a proxy</label>
                <label class="chk" data-show="public"><input type="checkbox" data-c="dceSource" ${st.dceSource ? 'checked' : ''}/> A DCR uses a DCE (e.g. Windows Firewall logs)</label>
                <label class="chk"><input type="checkbox" data-c="metrics" ${st.metrics ? 'checked' : ''}/> Send custom metrics</label>
              </div>
            </div>
          </div>
          <div class="plan-grid inputs">
            <div class="field"><label for="aR">Machine region</label><input class="inp" id="aR" data-t="region" value="${esc(st.region)}" spellcheck="false" placeholder="qatarcentral"/></div>
            <div class="field"><label for="aWR">Workspace region</label><input class="inp" id="aWR" data-t="wsRegion" value="${esc(st.wsRegion)}" spellcheck="false" placeholder="qatarcentral"/></div>
            <div class="field"><label for="aWs">Workspace ID</label><input class="inp" id="aWs" data-t="ws" value="" spellcheck="false" placeholder="00000000-0000-0000-0000-000000000000"/></div>
            <div class="field" data-show="dce"><label for="aD">DCE host prefix <span class="cm">(config, machine region)</span></label><input class="inp" id="aD" data-t="dce" spellcheck="false" placeholder="dce-soc-a1b2"/></div>
            <div class="field" data-show="dce-cross"><label for="aDI">Ingestion DCE prefix <span class="cm">(workspace region)</span></label><input class="inp" id="aDI" data-t="dceIngest" spellcheck="false" placeholder="dce-soc-ingest-c3d4"/></div>
            <div class="field" data-show="proxy"><label for="aP">Proxy URL</label><input class="inp" id="aP" data-t="proxyUrl" value="${esc(st.proxyUrl)}" spellcheck="false"/></div>
          </div>
        </div>
        <div id="amaOut"></div>`;

      const out = $('#amaOut', w);

      function plan() {
        const isArc = st.machine === 'arc', isWin = st.os === 'windows';
        const r = norm(st.region) || '<region>', wr = norm(st.wsRegion) || r;
        const ws = st.ws.trim() || '<workspace-id>';
        const usePls = isArc && st.net === 'private' && st.arcPls;
        const useAmpls = st.net === 'private' && (isArc ? st.ampls : true);
        const needDce = useAmpls || st.dceSource;
        const cross = wr !== r;
        const dceCfg = (st.dce.trim() || '<dce>') + `.${r}-1`;
        const dceIng = cross ? (st.dceIngest.trim() || '<ingest-dce>') + `.${wr}-1` : dceCfg;
        const E = [];
        const add = (host, purpose, when, route, group, test) => { if (!E.some(e => e.host === host)) E.push({ host, purpose, when, route, group, test: test === undefined ? (host.includes('*') ? null : host) : test }); };
        const pub = st.proxy ? 'proxy' : 'public';

        /* Azure Monitor Agent */
        if (!useAmpls) {
          add('global.handler.control.monitor.azure.com', 'AMA control service', 'Always', pub, 'Azure Monitor Agent');
          add(`${r}.handler.control.monitor.azure.com`, 'Fetch DCRs for this machine', 'Always', pub, 'Azure Monitor Agent');
          add(`${ws}.ods.opinsights.azure.com`, 'Log ingestion into the workspace', 'Always', pub, 'Azure Monitor Agent');
          add('global.prod.microsoftmetrics.com', 'Metrics service', 'Always', pub, 'Azure Monitor Agent');
          if (st.dceSource) add(`${dceIng}.ingest.monitor.azure.com`, 'Log ingestion through the DCE', 'DCRs that use a DCE', pub, 'Azure Monitor Agent');
        } else {
          add(`${dceCfg}.handler.control.monitor.azure.com`, 'Fetch DCRs (configuration DCE)', 'Always', 'private', 'Azure Monitor Agent');
          add(`${dceIng}.ingest.monitor.azure.com`, 'Log ingestion through the DCE', 'Always', 'private', 'Azure Monitor Agent');
          add(`${ws}.ods.opinsights.azure.com`, 'Workspace ingestion (ODS)', 'Always', 'private', 'Azure Monitor Agent');
          add(`${ws}.oms.opinsights.azure.com`, 'Workspace agent endpoint (OMS)', 'Always', 'private', 'Azure Monitor Agent');
        }
        if (st.metrics) {
          add('management.azure.com', 'Custom metrics (and Arc resource changes)', 'Custom metrics', 'public', 'Azure Monitor Agent');
          add(`${r}.monitoring.azure.com`, 'Custom metrics ingestion', 'Custom metrics', 'public', 'Azure Monitor Agent');
        }

        /* Arc Connected Machine agent */
        if (isArc) {
          add(isWin ? 'download.microsoft.com' : 'packages.microsoft.com', 'Agent install package', 'Install and updates', pub, 'Arc agent');
          add('login.microsoftonline.com', 'Entra ID token endpoint (global)', 'Always', pub, 'Arc agent');
          add('*.login.microsoft.com', 'Entra ID regional token endpoints', 'Always', pub, 'Arc agent', `${r}.login.microsoft.com`);
          add('pas.windows.net', 'Entra ID', 'Always', pub, 'Arc agent');
          if (!E.some(e => e.host === 'management.azure.com')) add('management.azure.com', 'Create / delete the Arc resource', 'Connect and disconnect', pub, 'Arc agent');
          add('*.his.arc.azure.com', 'Metadata and hybrid identity', 'Always', usePls ? 'private' : pub, 'Arc agent', 'gbl.his.arc.azure.com');
          add('*.guestconfiguration.azure.com', 'Extension management and guest configuration', 'Always', usePls ? 'private' : pub, 'Arc agent', 'agentserviceapi.guestconfiguration.azure.com');
          add('guestnotificationservice.azure.com', 'Notification service', 'Always', pub, 'Arc agent');
          add('*.guestnotificationservice.azure.com', 'Notification service (regional)', 'Always', pub, 'Arc agent', null);
          add('azgn*.servicebus.windows.net', 'Notification service', 'Always', pub, 'Arc agent', null);
        }

        /* service tags */
        const tags = [];
        if (isArc) {
          tags.push(['AzureActiveDirectory', 'Entra ID sign-in', true], ['AzureResourceManager', 'Resource Manager', true], ['AzureArcInfrastructure', 'Arc services (allow the full tag, not just one region)', !usePls],
            ['AzureTrafficManager', 'Arc endpoint routing', !usePls], ['Storage', 'Extension downloads', true], ['AzureFrontDoor.Frontend', 'Required for Arc since April 2026', true]);
          if (!useAmpls) tags.push(['AzureMonitor', 'AMA control and ingestion', true]);
        } else {
          tags.push(['AzureResourceManager', 'Required for AMA', true]);
          if (!useAmpls) tags.push(['AzureMonitor', 'AMA control and ingestion', true]);
          else tags.push(['VirtualNetwork', 'Reach the AMPLS private endpoint (NSG outbound)', true]);
        }

        /* DNS */
        const zones = [];
        if (useAmpls) zones.push(
          ['privatelink.monitor.azure.com', 'Global endpoints and the DCE handler.control / ingest hosts'],
          ['privatelink.oms.opinsights.azure.com', 'Workspace-specific agent endpoints'],
          ['privatelink.ods.opinsights.azure.com', 'Workspace ingestion (ODS)'],
          ['privatelink.agentsvc.azure-automation.net', 'Agent service automation'],
          ['privatelink.blob.core.windows.net', 'Solution packs storage account']);
        if (usePls) zones.push(['privatelink.his.arc.azure.com', 'Arc hybrid identity'], ['privatelink.guestconfiguration.azure.com', 'Arc extensions and guest configuration']);
        const fwd = zones.map(z => z[0].replace('privatelink.', ''));

        /* steps */
        const steps = [];
        if (isArc) {
          if (st.proxy) steps.push(`Set the Arc agent proxy <b>before</b> you connect: <code>azcmagent config set proxy.url</code>.${usePls ? ' Add a bypass so Arc traffic goes straight to the private endpoint.' : ''}`);
          if (usePls) steps.push('Create an <b>Arc Private Link Scope</b> in the <b>same region as the Arc servers</b>. Add a private endpoint (sub-resource <code>hybridcompute</code>) in a VNet reachable over VPN or ExpressRoute.');
          steps.push(usePls ? 'Onboard with a portal-generated script, choosing <b>Private endpoint</b> as the connectivity method. For servers already onboarded, associate them with the scope (up to 15 min to take effect).' : 'Onboard the server with <code>azcmagent connect</code> (a portal-generated script or a service principal at scale).');
        }
        if (useAmpls) {
          steps.push('Create an <b>Azure Monitor Private Link Scope</b>. Start with ingestion access mode <b>Open</b> and switch to <b>PrivateOnly</b> after validation.');
          steps.push('Add the <b>Log Analytics workspace</b> to the AMPLS.');
          steps.push(cross ? `Create a <b>configuration DCE in ${esc(r)}</b> (the machine's region) and an <b>ingestion DCE in ${esc(wr)}</b> (the workspace's region). Add both to the AMPLS.`
            : `Create a <b>DCE in ${esc(r)}</b> and add it to the AMPLS.`);
          steps.push(`Create the AMPLS <b>private endpoint</b> (sub-resource <code>azuremonitor</code>)${isArc ? ' in the VNet your on-prem network reaches' : ' in the hub VNet, or the VM\'s VNet if there is no hub'}. The subnet needs at least 11 free IPs.`);
          steps.push('Associate the machine with the configuration DCE (the association name must be <code>configurationAccessEndpoint</code>) and make every DCR use a DCE.');
        } else if (st.dceSource) {
          steps.push('Create a DCE in the workspace region and set it on the DCRs whose data source needs one.');
        }
        if (zones.length) steps.push(isArc ? 'Create the private DNS zones, link them to the VNet, then add <b>conditional forwarders</b> on your on-prem DNS to an Azure DNS Private Resolver inbound endpoint (or a DNS forwarder in Azure).'
          : 'Create the private DNS zones and link them to the VNet. If the VNet uses custom DNS, forward these zones to Azure DNS (168.63.129.16).');
        if (st.proxy) steps.push('Set the proxy on the <b>AMA extension</b> (see commands). Disable HTTPS inspection for every AMA endpoint.');
        steps.push('Install AMA and associate the DCRs (from Sentinel data connectors, a DCR, or Azure Policy).');
        steps.push('Run the test script on the machine. Every host should resolve and connect' + (zones.length ? ', and private hosts should resolve to <b>private IPs</b>.' : '.'));
        if (useAmpls) steps.push('Lock it down: set the AMPLS ingestion mode to <b>PrivateOnly</b>, and disable public network access on the workspace (ingestion) and the DCEs.');

        /* commands */
        const cmds = [];
        if (isArc && st.proxy) cmds.push(['Arc agent proxy', `azcmagent config set proxy.url "${st.proxyUrl}"${usePls ? '\n# send Arc service traffic to the private endpoint, not the proxy\nazcmagent config set proxy.bypass "Arc"' : ''}`]);
        if (st.proxy) {
          const ext = isWin ? 'AzureMonitorWindowsAgent' : 'AzureMonitorLinuxAgent';
          cmds.push([`AMA proxy (${isArc ? 'Arc' : 'Azure VM'}, ${isWin ? 'Windows' : 'Linux'})`, isArc
            ? `$settings = @{"proxy" = @{mode = "application"; address = "${st.proxyUrl}"; auth = "false"}}\nNew-AzConnectedMachineExtension -Name ${ext} -ExtensionType ${ext} -Publisher Microsoft.Azure.Monitor \`\n  -ResourceGroupName <rg> -MachineName <arc-server> -Location ${r} -Setting $settings`
            : `$settingsString = '{"proxy":{"mode":"application","address":"${st.proxyUrl}","auth":"false"}}'\nSet-AzVMExtension -ExtensionName ${ext} -ExtensionType ${ext} -Publisher Microsoft.Azure.Monitor \`\n  -ResourceGroupName <rg> -VMName <vm> -Location ${r} -SettingString $settingsString`]);
        }
        if (useAmpls) {
          cmds.push(['Add workspace and DCE to the AMPLS', `az monitor private-link-scope scoped-resource create \\\n  --resource-group <rg> --scope-name <ampls> --name law-link \\\n  --linked-resource <workspace-resource-id>\n\naz monitor private-link-scope scoped-resource create \\\n  --resource-group <rg> --scope-name <ampls> --name dce-link \\\n  --linked-resource <dce-resource-id>`]);
          cmds.push(['Associate the machine with the configuration DCE', `az monitor data-collection rule association create \\\n  --name configurationAccessEndpoint \\\n  --resource "<${isArc ? 'arc-machine' : 'vm'}-resource-id>" \\\n  --endpoint-id "<config-dce-resource-id>"`]);
        }
        if (usePls) cmds.push(['Associate an existing Arc server with the Arc Private Link Scope', `scopeId=$(az connectedmachine private-link-scope show \\\n  --resource-group <rg> --scope-name <arc-pls> --query id -o tsv)\n\naz connectedmachine update --resource-group <rg> --name <arc-server> \\\n  --private-link-scope-resource-id "$scopeId"`]);
        if (isArc) cmds.push(['Arc built-in connectivity check', `azcmagent check --location ${r}${usePls ? ' --enable-pls-check' : ''}`]);

        /* test script */
        const hosts = E.filter(e => e.test && !e.test.includes('<')).map(e => [e.test, e.route === 'private']);
        const placeholderHosts = E.filter(e => e.test && e.test.includes('<')).length;
        const script = isWin
          ? `# Run in PowerShell on the machine\n$hosts = @(\n${hosts.map(([h, p]) => `  @{ Host = '${h}'; Private = $${p} }`).join(",\n")}\n)\n$results = foreach ($t in $hosts) {\n  $ip  = (Resolve-DnsName $t.Host -Type A -ErrorAction SilentlyContinue | Where-Object IPAddress | Select-Object -First 1).IPAddress\n  $tcp = (Test-NetConnection $t.Host -Port 443 -WarningAction SilentlyContinue).TcpTestSucceeded\n  $isPriv = $ip -match '^(10\\.|172\\.(1[6-9]|2\\d|3[01])\\.|192\\.168\\.)'\n  $dns = if (-not $ip) { 'NO DNS' } elseif ($t.Private -and -not $isPriv) { 'PUBLIC IP (expected private)' } else { 'ok' }\n  [pscustomobject]@{ Host = $t.Host; IP = $ip; DNS = $dns; Tcp443 = $tcp }\n}\n$results | Format-Table -AutoSize`
          : `#!/usr/bin/env bash\n# Run on the machine\nwhile read -r host want; do\n  ip=$(getent ahostsv4 "$host" | awk 'NR==1{print $1}')\n  if timeout 5 bash -c "</dev/tcp/$host/443" 2>/dev/null; then tcp=OK; else tcp=FAIL; fi\n  dns=ok\n  [ -z "$ip" ] && dns="NO DNS"\n  if [ "$want" = private ] && [ -n "$ip" ] && ! echo "$ip" | grep -Eq '^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.)'; then dns="PUBLIC IP (expected private)"; fi\n  printf "%-62s %-16s %-30s %s\\n" "$host" "\${ip:--}" "$dns" "$tcp"\ndone <<'EOF'\n${hosts.map(([h, p]) => `${h} ${p ? 'private' : 'public'}`).join('\n')}\nEOF`;

        /* gotchas */
        const g = ['Disable <b>HTTPS / TLS inspection</b> for every AMA endpoint. It is the most common cause of AMA failing silently behind a firewall.'];
        if (useAmpls) g.push('With AMPLS, <b>all DCRs must use DCEs</b>, and every DCE has to be added to the AMPLS. The configuration DCE must be in the machine\'s region; the ingestion DCE in the workspace\'s region.',
          '<b>One AMPLS per DNS.</b> A second AMPLS on a network that shares DNS overwrites the same records and breaks the first. In hub-and-spoke, put it on the hub.',
          'Once AMPLS DNS is in place, <b>every AMA on that DNS needs a DCE</b>, including machines you didn\'t plan to make private.');
        if (useAmpls && isArc) g.push('Forwarding <code>blob.core.windows.net</code> to Azure DNS affects <b>every storage account</b> your on-prem clients resolve. If a storage account has no private endpoint, it still resolves publicly, but test it before you change production DNS.');
        if (usePls) g.push('Arc Private Link Scope only covers <b>Arc</b>. AMA still needs its own <b>AMPLS</b> for private ingestion.',
          '<b>Entra ID and Resource Manager stay public</b> even with Arc Private Link. Keep them allowed (or add a Resource Management private link for ARM).',
          'The Arc server and Arc Private Link Scope must be in the <b>same region</b>, and one VNet can only have <b>one</b> Arc Private Link Scope.');
        if (isArc) g.push('The Arc agent does <b>not</b> support a Log Analytics gateway as its proxy (AMA does). Use a normal HTTP proxy or Arc gateway.');
        if (isArc && !usePls) g.push('Allow the <b>full AzureArcInfrastructure</b> tag. The regional ranges don\'t include the global components.');
        if (!isArc) g.push('Don\'t block <code>168.63.129.16</code>. The Azure VM agent uses it to install and update the AMA extension.');
        if (st.proxy && !isWin) g.push('Linux AMA only honours the <code>http_proxy</code> / <code>https_proxy</code> environment variables from version 1.24.2.');
        if (st.metrics) g.push('<b>Custom metrics</b> don\'t support proxies or private link. They always go to the public endpoints listed.');
        if (needDce) g.push('DCE hosts include a numeric suffix like <code>.' + esc(r) + '-1</code>. Copy the exact hostname from the DCE overview page; it can differ.');
        if (placeholderHosts) g.push(`<b>${placeholderHosts}</b> host${placeholderHosts > 1 ? 's are' : ' is'} left out of the test script until you fill in the workspace ID${needDce ? ' and DCE prefix' : ''}.`);

        return { isArc, usePls, useAmpls, needDce, cross, r, wr, E, tags, zones, fwd, steps, cmds, script, g };
      }

      const routeLbl = { private: 'Private endpoint', public: 'Internet', proxy: 'Via proxy' };
      const routeCls = { private: 'g', public: 'b', proxy: 'w' };

      function run() {
        const isArc = st.machine === 'arc';
        w.querySelectorAll('[data-show]').forEach(el => {
          const k = el.dataset.show;
          const show = k === 'arc-private' ? isArc && st.net === 'private'
            : k === 'public' ? st.net === 'public'
            : k === 'dce' ? (st.net === 'private' && (!isArc || st.ampls)) || (st.net === 'public' && st.dceSource)
            : k === 'dce-cross' ? norm(st.wsRegion) !== norm(st.region) && ((st.net === 'private' && (!isArc || st.ampls)) || st.dceSource)
            : k === 'proxy' ? st.proxy : true;
          el.style.display = show ? '' : 'none';
        });
        const p = plan();
        const priv = p.E.filter(e => e.route === 'private'), other = p.E.filter(e => e.route !== 'private');
        const pills = [
          `<span class="pill b">${p.isArc ? 'Arc-enabled server' : 'Azure VM'} · ${st.os === 'windows' ? 'Windows' : 'Linux'}</span>`,
          p.useAmpls ? '<span class="pill g">AMPLS</span>' : '',
          p.usePls ? '<span class="pill g">Arc Private Link Scope</span>' : '',
          st.proxy ? '<span class="pill w">Proxy</span>' : '',
          p.needDce ? `<span class="pill ${p.useAmpls ? 'g' : ''}">DCE required${p.cross && p.useAmpls ? ' (2: config + ingestion)' : ''}</span>` : '<span class="pill">No DCE needed</span>',
          `<span class="pill">${p.E.length} endpoints · ${p.zones.length} DNS zones</span>`
        ].join('');
        const listTxt = p.E.map(e => `${e.host}\t443\t${routeLbl[e.route]}\t${e.purpose}`).join('\n');
        out.innerHTML = `
          <div class="w-sec">
            <div class="summary">${pills}</div>
            <div class="route-split">
              <div class="route-card ${priv.length ? '' : 'empty'}"><h4><span class="dot-g"></span>Over the private endpoint</h4>${priv.length ? `<ul>${priv.map(e => `<li>${esc(e.purpose)}</li>`).join('')}</ul>` : '<p>Nothing. Switch the network path to Private link to see this.</p>'}</div>
              <div class="route-card"><h4><span class="dot-${st.proxy ? 'w' : 'b'}"></span>${st.proxy ? 'Through the proxy' : 'Over the internet'}</h4>${other.length ? `<ul>${[...new Set(other.map(e => e.group === 'Arc agent' && /Entra/.test(e.purpose) ? 'Entra ID sign-in' : e.purpose))].map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p>Nothing. All agent traffic stays private.</p>'}</div>
            </div>
          </div>
          <div class="w-sec">
            <h3><span>Outbound allow-list · TCP 443</span><span class="row-actions"><button class="btn sm" data-copy="${esc(p.E.map(e => e.host).join('\n'))}" data-label="hostnames">Copy hostnames</button><button class="btn sm" data-copy="${esc(listTxt)}" data-label="full allow-list">Copy as table</button></span></h3>
            <div class="tbl-wrap"><table class="kv"><thead><tr><th>Endpoint</th><th>Route</th><th>Purpose</th><th>When</th></tr></thead><tbody>
              ${['Azure Monitor Agent', 'Arc agent'].map(gname => {
                const rows = p.E.filter(e => e.group === gname); if (!rows.length) return '';
                return `<tr class="grp"><td colspan="4">${gname}</td></tr>` + rows.map(e => `<tr><td class="v"><span ${cp(e.host, e.host)}>${esc(e.host)}</span></td><td><span class="pill ${routeCls[e.route]}">${routeLbl[e.route]}</span></td><td class="d">${esc(e.purpose)}</td><td class="d">${esc(e.when)}</td></tr>`).join('');
              }).join('')}
            </tbody></table></div>
          </div>
          <div class="w-sec">
            <h3><span>Service tags${p.isArc ? ' <span style="text-transform:none;letter-spacing:0">(for IP-based on-prem firewalls, use the Service Tags JSON)</span>' : ' (NSG / Azure Firewall)'}</span></h3>
            <div class="tags-grid">${p.tags.map(([t, d, need]) => `<div class="tagcard ${need ? '' : 'dim'}"><code ${cp(t, t)}>${esc(t)}</code><span>${esc(d)}${need ? '' : ' · not needed when traffic is private'}</span></div>`).join('')}</div>
          </div>
          ${p.zones.length ? `<div class="w-sec">
            <h3><span>Private DNS zones</span><span class="row-actions"><button class="btn sm" data-copy="${esc(p.zones.map(z => z[0]).join('\n'))}" data-label="DNS zones">Copy zones</button>${p.isArc ? `<button class="btn sm" data-copy="${esc(p.fwd.join('\n'))}" data-label="forwarder zones">Copy forwarder zones</button>` : ''}</span></h3>
            <table class="kv"><tbody>${p.zones.map(([z, d]) => `<tr><td class="v"><span ${cp(z, z)}>${esc(z)}</span></td><td class="d">${esc(d)}</td></tr>`).join('')}</tbody></table>
            ${p.isArc ? `<div class="info" style="margin-top:12px"><span><b>On-prem DNS:</b> create conditional forwarders for <code>${p.fwd.map(esc).join('</code>, <code>')}</code> pointing to your Azure DNS Private Resolver inbound endpoint. For a handful of servers, a hosts file works for testing.</span></div>` : ''}
          </div>` : ''}
          <div class="w-sec"><h3>Setup steps</h3><ol class="olist">${p.steps.map(s => `<li><span>${s}</span></li>`).join('')}</ol></div>
          ${p.cmds.length ? `<div class="w-sec"><h3>Commands</h3>${p.cmds.map(([t, c]) => `<div class="cmd-block"><div class="cmd-h"><span>${esc(t)}</span><button class="btn sm" data-copy="${esc(c)}" data-label="${esc(t)}">Copy</button></div><pre class="code">${esc(c)}</pre></div>`).join('')}</div>` : ''}
          <div class="w-sec">
            <h3><span>Connectivity test · ${st.os === 'windows' ? 'PowerShell' : 'Bash'}</span><span class="row-actions"><button class="btn sm" data-copy="${esc(p.script)}" data-label="test script">Copy script</button></span></h3>
            <pre class="code" style="max-height:360px">${esc(p.script)}</pre>
            <p class="hint-line">Checks DNS and TCP 443 for every concrete host above${p.zones.length ? ', and flags private-link hosts that still resolve to a public IP' : ''}. Wildcards are tested with a representative host.</p>
          </div>
          <div class="w-sec"><h3>Watch out for</h3><ul class="gotchas">${p.g.map(x => `<li><span>${x}</span></li>`).join('')}</ul>
            <p class="hint-line">Based on Microsoft Learn: AMA network configuration, Arc network requirements, Arc Private Link, AMPLS and DCE docs. Endpoints change; check the docs before a production change.</p></div>`;
      }

      w.addEventListener('click', e => {
        const b = e.target.closest('.seg[data-key] button'); if (!b) return;
        const seg = b.parentElement; st[seg.dataset.key] = b.dataset.v;
        seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
        run();
      });
      w.addEventListener('change', e => { const c = e.target.dataset.c; if (c) { st[c] = e.target.checked; run(); } });
      w.addEventListener('input', e => { const t = e.target.dataset.t; if (t) { st[t] = e.target.value; run(); } });
      run();
    }

    /* =========================================================
       DCR builder
       Sources: learn.microsoft.com
         azure-monitor/data-collection/data-collection-rule-samples
         azure-monitor/data-collection/data-collection-rule-structure
         azure-monitor/vm/data-collection-windows-events (XPath, 20-expression limit)
         azure-monitor/agents/data-collection-log-text
         sentinel/windows-security-event-id-reference (Minimal set)
         sentinel/connect-cef-syslog-ama, sentinel/cef-syslog-ama-overview
       ========================================================= */
    const SEC_MINIMAL = [1102, 4624, 4625, 4657, 4663, 4688, 4700, 4702, 4719, 4720, 4722, 4723, 4724, 4727, 4728, 4732, 4735, 4737, 4739, 4740, 4754, 4755, 4756, 4767, 4799, 4825, 4946, 4948, 4956, 5024, 5033];
    const FACILITIES = ['auth', 'authpriv', 'cron', 'daemon', 'kern', 'local0', 'local1', 'local2', 'local3', 'local4', 'local5', 'local6', 'local7', 'mail', 'syslog', 'user', 'ftp', 'ntp'];
    const LEVELS = ['Debug', 'Info', 'Notice', 'Warning', 'Error', 'Critical', 'Alert', 'Emergency'];
    const WIN_LEVELS = [['1', 'Critical'], ['2', 'Error'], ['3', 'Warning'], ['4', 'Information'], ['5', 'Verbose']];
    const TIME_FORMATS = ['ISO 8601', 'yyyy-MM-ddTHH:mm:ssk', 'YYYY-MM-DD HH:MM:SS', 'M/D/YYYY HH:MM:SS AM/PM', 'Mon DD, YYYY HH:MM:SS', 'yyMMdd HH:mm:ss', 'ddMMyy HH:mm:ss', 'MMM d HH:mm:ss', 'dd/MMM/yyyy:HH:mm:ss zzz'];

    // "4624, 4720-4740" -> sorted unique ints
    function parseIds(text) {
      const out = new Set(), bad = [];
      (text || '').split(/[\s,;]+/).filter(Boolean).forEach(t => {
        const m = t.match(/^(\d+)(?:-(\d+))?$/);
        if (!m) return bad.push(t);
        const a = +m[1], b = m[2] ? +m[2] : a;
        if (b < a || b - a > 5000) return bad.push(t);
        for (let i = a; i <= b; i++) out.add(i);
      });
      return { ids: [...out].sort((x, y) => x - y), bad };
    }
    // ids -> XPath expressions, compressing runs of 3+ into a range (cost 2)
    function idExprs(ids) {
      const ex = []; let i = 0;
      while (i < ids.length) {
        let j = i; while (j + 1 < ids.length && ids[j + 1] === ids[j] + 1) j++;
        if (j - i >= 2) { ex.push({ s: `(EventID >= ${ids[i]} and EventID <= ${ids[j]})`, cost: 2 }); i = j + 1; }
        else { for (let k = i; k <= j; k++) ex.push({ s: `EventID=${ids[k]}`, cost: 1 }); i = j + 1; }
      }
      return ex;
    }
    // channel + ids (+ optional level clause) -> XPath queries, each within the 20-expression DCR limit
    function xpaths(channel, ids, levelClause) {
      if (!ids.length) return [`${channel}!*${levelClause ? `[System[${levelClause}]]` : ''}`];
      const budget = 20 - (levelClause ? (levelClause.match(/Level=/g) || []).length : 0);
      const chunks = []; let cur = [], used = 0;
      idExprs(ids).forEach(e => { if (used + e.cost > budget && cur.length) { chunks.push(cur); cur = []; used = 0; } cur.push(e.s); used += e.cost; });
      if (cur.length) chunks.push(cur);
      return chunks.map(c => `${channel}!*[System[${levelClause ? levelClause + ' and ' : ''}(${c.join(' or ')})]]`);
    }
    const levelClauseOf = lv => lv.length ? '(' + lv.flatMap(l => l === '4' ? ['Level=4', 'Level=0'] : [`Level=${l}`]).join(' or ') + ')' : '';

    function renderDcr(w) {
      const st = {
        name: 'dcr-soc-windows-linux', location: 'qatarcentral', ws: '', dce: '',
        sec: { on: true, preset: 'minimal', ids: '4624, 4625, 4688, 4720-4740, 1102', applocker: true, transform: 'source' },
        evt: { on: false, system: ['1', '2', '3'], application: ['1', '2', '3'], custom: 'Microsoft-Windows-Sysmon/Operational', customIds: '', customOn: false, transform: 'source' },
        fwd: { on: false, transform: 'source' },
        sys: { on: false, fac: ['auth', 'authpriv', 'cron', 'daemon', 'kern', 'syslog'], min: 'Warning', filterCef: true, transform: 'source' },
        cef: { on: true, fac: ['local4'], min: 'Info', transform: 'source' },
        txt: { on: false, os: 'linux', pattern: '/var/log/myapp/*.log', table: 'MyApp', time: 'ISO 8601', delim: '', cols: 'Time:datetime, Level:string, Message:string' }
      };
      const chkList = (path, items, sel) => items.map(([v, l]) => `<label class="chk sm"><input type="checkbox" data-arr="${path}" value="${v}" ${sel.includes(v) ? 'checked' : ''}/> ${l}</label>`).join('');
      const facOpts = (path, sel) => chkList(path, FACILITIES.map(f => [f, f]), sel);
      const lvlSel = (path, val) => `<select data-v="${path}">${LEVELS.map(l => `<option ${l === val ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
      const card = (key, title, sub, table, body) => `
        <div class="src-card ${st[key].on ? 'on' : ''}" data-card="${key}">
          <label class="src-head"><input type="checkbox" data-on="${key}" ${st[key].on ? 'checked' : ''}/><span><b>${title}</b><small>${sub}</small></span><code>${table}</code></label>
          <div class="src-body">${body}</div>
        </div>`;
      const tf = key => `<div class="field"><label>Transformation (KQL, optional)</label><input class="inp" data-v="${key}.transform" value="${esc(st[key].transform)}" spellcheck="false"/></div>`;

      w.innerHTML = `
        <div class="w-head"><div><h2>DCR builder</h2><p>Build a data collection rule for the Azure Monitor Agent: Windows Security events, event logs with XPath, forwarded events, Syslog, CEF and custom text logs. Get deployable JSON, the deploy commands and a query to check data arrives.</p></div></div>
        <div class="w-sec">
          <h3>Basics</h3>
          <div class="plan-grid inputs" style="margin:0;padding:0;border:0">
            <div class="field"><label>DCR name</label><input class="inp" data-v="name" value="${esc(st.name)}" spellcheck="false"/></div>
            <div class="field"><label>Region</label><input class="inp" data-v="location" value="${esc(st.location)}" spellcheck="false"/></div>
            <div class="field"><label>Workspace resource ID</label><input class="inp" data-v="ws" spellcheck="false" placeholder="/subscriptions/…/workspaces/law-soc"/></div>
            <div class="field" style="grid-column:1/-1"><label>DCE resource ID <span class="cm">(optional; needed for private link and text logs)</span></label><input class="inp" data-v="dce" spellcheck="false" placeholder="/subscriptions/…/dataCollectionEndpoints/dce-soc"/></div>
          </div>
        </div>
        <div class="w-sec">
          <h3>Data sources</h3>
          <div class="src-list">
            ${card('sec', 'Windows Security events', 'What the Sentinel "Windows Security Events via AMA" connector collects', 'SecurityEvent', `
              <div class="field"><label>Event set</label><span class="seg" data-seg="sec.preset">${[['minimal', 'Minimal (Sentinel)'], ['all', 'All events'], ['custom', 'Custom IDs']].map(([v, l]) => `<button data-sv="${v}" aria-pressed="${st.sec.preset === v}">${l}</button>`).join('')}</span></div>
              <div class="field" data-when="sec.custom"><label>Event IDs <span class="cm">(commas, ranges like 4720-4740)</span></label><input class="inp" data-v="sec.ids" value="${esc(st.sec.ids)}" spellcheck="false"/></div>
              <label class="chk" data-when="sec.notall"><input type="checkbox" data-b="sec.applocker" ${st.sec.applocker ? 'checked' : ''}/> Include AppLocker events (8001-8007)</label>
              ${tf('sec')}`)}
            ${card('evt', 'Windows event logs', 'System, Application and any other channel, filtered by level or ID', 'Event', `
              <div class="field"><label>System levels</label><div class="chk-row">${chkList('evt.system', WIN_LEVELS, st.evt.system)}</div></div>
              <div class="field"><label>Application levels</label><div class="chk-row">${chkList('evt.application', WIN_LEVELS, st.evt.application)}</div></div>
              <label class="chk"><input type="checkbox" data-b="evt.customOn" ${st.evt.customOn ? 'checked' : ''}/> Add another channel</label>
              <div class="grid2" data-when="evt.custom"><div class="field"><label>Channel</label><input class="inp" data-v="evt.custom" value="${esc(st.evt.custom)}" spellcheck="false"/></div><div class="field"><label>Event IDs <span class="cm">(blank = all)</span></label><input class="inp" data-v="evt.customIds" spellcheck="false" placeholder="1, 3, 11"/></div></div>
              ${tf('evt')}`)}
            ${card('fwd', 'Windows Forwarded Events', 'Events collected by a Windows Event Collector (WEF)', 'WindowsEvent', tf('fwd'))}
            ${card('sys', 'Syslog', 'Linux system logs, or plain syslog from appliances via a forwarder', 'Syslog', `
              <div class="field"><label>Facilities</label><div class="chk-row">${facOpts('sys.fac', st.sys.fac)}</div></div>
              <div class="field"><label>Minimum level</label>${lvlSel('sys.min', st.sys.min)}</div>
              <label class="chk"><input type="checkbox" data-b="sys.filterCef" ${st.sys.filterCef ? 'checked' : ''}/> Filter CEF messages out of Syslog (avoids duplicates)</label>
              ${tf('sys')}`)}
            ${card('cef', 'CEF', 'FortiGate, Palo Alto and other appliances via a Linux forwarder', 'CommonSecurityLog', `
              <div class="field"><label>Facilities <span class="cm">(the facility your firewalls send CEF on)</span></label><div class="chk-row">${facOpts('cef.fac', st.cef.fac)}</div></div>
              <div class="field"><label>Minimum level</label>${lvlSel('cef.min', st.cef.min)}</div>
              ${tf('cef')}`)}
            ${card('txt', 'Custom text log', 'Any application log file on the machine', 'Custom _CL table', `
              <div class="field"><label>OS</label><span class="seg" data-seg="txt.os"><button data-sv="windows" aria-pressed="${st.txt.os === 'windows'}">Windows</button><button data-sv="linux" aria-pressed="${st.txt.os === 'linux'}">Linux</button></span></div>
              <div class="grid2"><div class="field"><label>File pattern</label><input class="inp" data-v="txt.pattern" value="${esc(st.txt.pattern)}" spellcheck="false"/></div>
              <div class="field"><label>Table name <span class="cm">(_CL is added)</span></label><input class="inp" data-v="txt.table" value="${esc(st.txt.table)}" spellcheck="false"/></div></div>
              <div class="grid2"><div class="field"><label>Timestamp format</label><select data-v="txt.time">${TIME_FORMATS.map(t => `<option ${t === st.txt.time ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
              <div class="field"><label>Delimiter <span class="cm">(blank = keep RawData)</span></label><input class="inp" data-v="txt.delim" spellcheck="false" placeholder=","/></div></div>
              <div class="field" data-when="txt.delim"><label>Columns in order <span class="cm">(name:type)</span></label><input class="inp" data-v="txt.cols" value="${esc(st.txt.cols)}" spellcheck="false"/></div>`)}
          </div>
        </div>
        <div id="dcrOut"></div>`;

      const out = $('#dcrOut', w);
      const get = p => p.split('.').reduce((o, k) => o[k], st);
      const set = (p, v) => { const k = p.split('.'); const last = k.pop(); k.reduce((o, x) => o[x], st)[last] = v; };

      function build() {
        const warn = [], info = [];
        const wsId = st.ws.trim() || '/subscriptions/<sub-id>/resourceGroups/<rg>/providers/Microsoft.OperationalInsights/workspaces/<workspace>';
        const dest = 'logAnalyticsDest';
        const ds = {}, flows = [], streamsDecl = {}, tables = [];
        const tfm = t => (t || '').trim() || 'source';
        const flow = (stream, out, t) => flows.push({ streams: [stream], destinations: [dest], transformKql: tfm(t), outputStream: out });
        let winSrc = false, linSrc = false, xpathCount = 0;

        if (st.sec.on) {
          winSrc = true;
          let q = [];
          if (st.sec.preset === 'all') q = ['Security!*'];
          else {
            const ids = st.sec.preset === 'minimal' ? SEC_MINIMAL : parseIds(st.sec.ids).ids;
            if (st.sec.preset === 'custom') { const b = parseIds(st.sec.ids).bad; if (b.length) warn.push(`Ignored invalid event IDs: <code>${b.map(esc).join(', ')}</code>`); if (!ids.length) warn.push('Custom set has no event IDs, so this collects the whole Security log.'); }
            q = xpaths('Security', ids);
          }
          if (st.sec.applocker || st.sec.preset === 'all') {
            if (st.sec.preset === 'all') q.push('Microsoft-Windows-AppLocker/EXE and DLL!*', 'Microsoft-Windows-AppLocker/MSI and Script!*');
            else q.push(...xpaths('Microsoft-Windows-AppLocker/EXE and DLL', [8001, 8002, 8003, 8004]), ...xpaths('Microsoft-Windows-AppLocker/MSI and Script', [8005, 8006, 8007]));
          }
          xpathCount += q.length;
          (ds.windowsEventLogs ||= []).push({ name: 'securityEvents', streams: ['Microsoft-SecurityEvent'], xPathQueries: q });
          flow('Microsoft-SecurityEvent', 'Microsoft-SecurityEvent', st.sec.transform); tables.push('SecurityEvent');
          if (st.sec.preset === 'minimal') info.push('Minimal set taken from Microsoft\'s Sentinel event ID reference. The official set also lists AppLocker event 8222.');
        }
        if (st.evt.on) {
          winSrc = true;
          const q = [];
          if (st.evt.system.length) q.push(...xpaths('System', [], levelClauseOf(st.evt.system)));
          if (st.evt.application.length) q.push(...xpaths('Application', [], levelClauseOf(st.evt.application)));
          if (st.evt.customOn && st.evt.custom.trim()) q.push(...xpaths(st.evt.custom.trim(), parseIds(st.evt.customIds).ids));
          if (!q.length) warn.push('Windows event logs is on but no channel or level is selected.');
          else { xpathCount += q.length; (ds.windowsEventLogs ||= []).push({ name: 'eventLogs', streams: ['Microsoft-Event'], xPathQueries: q }); flow('Microsoft-Event', 'Microsoft-Event', st.evt.transform); tables.push('Event'); }
          if (st.evt.customOn && /sysmon/i.test(st.evt.custom)) info.push('Sysmon lands in the <b>Event</b> table with the details in <code>EventData</code> XML. Parse it with a function or the ASIM parsers.');
        }
        if (st.fwd.on) {
          winSrc = true; xpathCount++;
          (ds.windowsEventLogs ||= []).push({ name: 'forwardedEvents', streams: ['Microsoft-WindowsEvent'], xPathQueries: ['ForwardedEvents!*'] });
          flow('Microsoft-WindowsEvent', 'Microsoft-WindowsEvent', st.fwd.transform); tables.push('WindowsEvent');
          info.push('Forwarded events go to <b>WindowsEvent</b>, not SecurityEvent. Many built-in Sentinel rules query SecurityEvent, so check the rules you rely on.');
        }
        const lvAbove = min => LEVELS.slice(LEVELS.indexOf(min));
        if (st.sys.on) {
          linSrc = true;
          if (!st.sys.fac.length) warn.push('Syslog is on but no facility is selected.');
          else {
            (ds.syslog ||= []).push({ name: 'sysLogsDataSource', streams: ['Microsoft-Syslog'], facilityNames: st.sys.fac, logLevels: lvAbove(st.sys.min) });
            let t = tfm(st.sys.transform);
            if (st.sys.filterCef && st.cef.on) t = (t === 'source' ? 'source' : t) + ' | where ProcessName !contains "CEF" and SyslogMessage !contains "CEF:0"';
            flow('Microsoft-Syslog', 'Microsoft-Syslog', t); tables.push('Syslog');
          }
        }
        if (st.cef.on) {
          linSrc = true;
          if (!st.cef.fac.length) warn.push('CEF is on but no facility is selected.');
          else { (ds.syslog ||= []).push({ name: 'cefDataSource', streams: ['Microsoft-CommonSecurityLog'], facilityNames: st.cef.fac, logLevels: lvAbove(st.cef.min) }); flow('Microsoft-CommonSecurityLog', 'Microsoft-CommonSecurityLog', st.cef.transform); tables.push('CommonSecurityLog'); }
          const overlap = st.sys.on ? st.cef.fac.filter(f => st.sys.fac.includes(f)) : [];
          if (overlap.length && !st.sys.filterCef) warn.push(`Facility <code>${overlap.join(', ')}</code> is used by both Syslog and CEF, so CEF messages will be ingested twice (Syslog and CommonSecurityLog). Use separate facilities, or tick "Filter CEF messages out of Syslog".`);
          else if (overlap.length) info.push(`Facility <code>${overlap.join(', ')}</code> is shared by Syslog and CEF. The Syslog flow filters CEF out to prevent duplicates.`);
          info.push('After the DCR, run the Sentinel forwarder installation script on the Linux machine so rsyslog / syslog-ng listens on 514.');
        }
        let txtTable = '';
        if (st.txt.on) {
          (st.txt.os === 'windows' ? (winSrc = true) : (linSrc = true));
          const base = (st.txt.table.trim() || 'MyApp').replace(/_CL$/i, '').replace(/[^A-Za-z0-9_]/g, '');
          txtTable = base + '_CL';
          const sName = `Custom-Text-${base}`;
          streamsDecl[sName] = { columns: [{ name: 'TimeGenerated', type: 'datetime' }, { name: 'RawData', type: 'string' }, { name: 'FilePath', type: 'string' }, { name: 'Computer', type: 'string' }] };
          const pats = st.txt.pattern.split(',').map(s => s.trim()).filter(Boolean);
          (ds.logFiles ||= []).push({ name: `${base}-${st.txt.os}`, streams: [sName], filePatterns: pats.length ? pats : ['<path>'], format: 'text', settings: { text: { recordStartTimestampFormat: st.txt.time } } });
          let t = 'source', cols = [];
          if (st.txt.delim) {
            cols = st.txt.cols.split(',').map(c => c.trim()).filter(Boolean).map(c => { const [n, ty] = c.split(':').map(x => x.trim()); return { n: n.replace(/[^A-Za-z0-9_]/g, ''), ty: (ty || 'string').toLowerCase() }; }).filter(c => c.n);
            const conv = { datetime: 'todatetime', int: 'toint', long: 'tolong', real: 'toreal', bool: 'tobool', boolean: 'tobool', dynamic: 'todynamic', string: 'tostring' };
            const d = st.txt.delim === '\\t' ? '\\t' : st.txt.delim.replace(/"/g, '\\"');
            t = `source | extend d = split(RawData, "${d}") | project ${cols.map((c, i) => `${/^time/i.test(c.n) && c.ty === 'datetime' ? 'TimeGenerated' : c.n} = ${conv[c.ty] || 'tostring'}(d[${i}])`).join(', ')}, Computer, FilePath`;
          }
          flow(sName, `Custom-${txtTable}`, t); tables.push(txtTable);
          if (!st.dce.trim()) warn.push('Custom text logs: Microsoft\'s sample DCR includes a <b>DCE</b>. Add a DCE resource ID.');
          warn.push(`Create the <b>${esc(txtTable)}</b> table first (script below). The DCR deploy fails if the table or its columns don't exist.`);
          if (pats.some(p => (st.txt.os === 'windows') !== /^[A-Za-z]:\\|^\\\\/.test(p))) warn.push(`File pattern doesn't look like a ${st.txt.os === 'windows' ? 'Windows' : 'Linux'} path.`);
          st._txtCols = cols;
        }
        if (!flows.length) warn.push('Turn on at least one data source.');
        if (xpathCount && st.sec.preset !== 'all') info.push(`XPath queries are split to stay within the DCR limit of <b>20 expressions</b> per query, and consecutive IDs are merged into ranges.`);
        if (!st.ws.trim()) warn.push('Add the workspace resource ID; a placeholder is used for now.');

        const props = {};
        if (st.dce.trim()) props.dataCollectionEndpointId = st.dce.trim();
        if (Object.keys(streamsDecl).length) props.streamDeclarations = streamsDecl;
        props.dataSources = ds;
        props.destinations = { logAnalytics: [{ workspaceResourceId: wsId, name: dest }] };
        props.dataFlows = flows;
        const dcr = { location: st.location.trim().toLowerCase().replace(/\s+/g, '') || 'qatarcentral' };
        if (winSrc && !linSrc) dcr.kind = 'Windows'; else if (linSrc && !winSrc) dcr.kind = 'Linux';
        if (winSrc && linSrc) info.push('This DCR mixes Windows and Linux sources, so <code>kind</code> is left out. Each agent only picks up the sources for its OS.');
        dcr.properties = props;
        return { dcr, warn, info, tables, txtTable, kind: dcr.kind };
      }

      function jsonHlDcr(s) {
        return esc(s)
          .replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="key">$1</span>$2')
          .replace(/(:\s*|\[\s*|,\s*)(&quot;.*?&quot;)(?=\s*[,\]\n}])/g, '$1<span class="s">$2</span>');
      }

      function run() {
        w.querySelectorAll('[data-card]').forEach(c => c.classList.toggle('on', st[c.dataset.card].on));
        const show = { 'sec.custom': st.sec.preset === 'custom', 'sec.notall': st.sec.preset !== 'all', 'evt.custom': st.evt.customOn, 'txt.delim': !!st.txt.delim };
        w.querySelectorAll('[data-when]').forEach(el => el.style.display = show[el.dataset.when] ? '' : 'none');
        const r = build();
        const json = JSON.stringify(r.dcr, null, 2);
        const name = st.name.trim() || 'my-dcr';
        const loc = r.dcr.location;
        const deploy = `# Azure CLI\naz monitor data-collection rule create \\\n  --name "${name}" --resource-group "<rg>" --location "${loc}" \\\n  --rule-file "./${name}.json"\n\n# Associate with a machine (Azure VM or Arc server)\naz monitor data-collection rule association create \\\n  --name "${name}-assoc" \\\n  --rule-id "/subscriptions/<sub-id>/resourceGroups/<rg>/providers/Microsoft.Insights/dataCollectionRules/${name}" \\\n  --resource "<vm-or-arc-machine-resource-id>"${st.dce.trim() ? `\n\n# With private link, also associate the configuration DCE\naz monitor data-collection rule association create \\\n  --name configurationAccessEndpoint \\\n  --endpoint-id "${st.dce.trim()}" \\\n  --resource "<vm-or-arc-machine-resource-id>"` : ''}\n\n# PowerShell alternative\nNew-AzDataCollectionRule -Name "${name}" -ResourceGroupName "<rg>" -JsonFilePath "./${name}.json"`;
        let tableScript = '';
        if (r.txtTable) {
          const extra = (st._txtCols || []).filter(c => !(/^time/i.test(c.n) && c.ty === 'datetime')).map(c => ({ name: c.n, type: c.ty === 'int' ? 'int' : c.ty }));
          const cols = [{ name: 'TimeGenerated', type: 'datetime' }, { name: 'Computer', type: 'string' }, { name: 'FilePath', type: 'string' }, ...(st.txt.delim ? extra : [{ name: 'RawData', type: 'string' }])];
          tableScript = `$tableParams = @'\n${JSON.stringify({ properties: { schema: { name: r.txtTable, columns: cols } } }, null, 2)}\n'@\n\nInvoke-AzRestMethod -Method PUT -Payload $tableParams -Path "/subscriptions/<sub-id>/resourcegroups/<rg>/providers/microsoft.operationalinsights/workspaces/<workspace>/tables/${r.txtTable}?api-version=2022-10-01"`;
        }
        const verify = r.tables.map(t => `${t}\n| where TimeGenerated > ago(30m)\n| summarize Events = count(), LastSeen = max(TimeGenerated) by Computer`).join('\n\n') + (r.tables.length ? '\n\n// agent is alive?\nHeartbeat\n| where TimeGenerated > ago(15m)\n| summarize LastHeartbeat = max(TimeGenerated) by Computer, Category' : '');
        out.innerHTML = `
          <div class="w-sec">
            <div class="summary">${r.kind ? `<span class="pill b">kind: ${r.kind}</span>` : '<span class="pill">kind: mixed</span>'}${r.tables.map(t => `<span class="pill g">→ ${esc(t)}</span>`).join('')}${st.dce.trim() ? '<span class="pill">DCE set</span>' : ''}</div>
            ${r.warn.length ? `<ul class="gotchas">${r.warn.map(x => `<li><span>${x}</span></li>`).join('')}</ul>` : ''}
            ${r.info.length ? `<ul class="notes">${r.info.map(x => `<li><span>${x}</span></li>`).join('')}</ul>` : ''}
          </div>
          <div class="w-sec">
            <h3><span>DCR JSON</span><span class="row-actions"><button class="btn sm" data-copy="${esc(json)}" data-label="DCR JSON">Copy</button><button class="btn sm solid" id="dcrDl">Download ${esc(name)}.json</button></span></h3>
            <pre class="code" style="max-height:460px">${jsonHlDcr(json)}</pre>
          </div>
          ${tableScript ? `<div class="w-sec"><h3><span>Create the custom table first</span><span class="row-actions"><button class="btn sm" data-copy="${esc(tableScript)}" data-label="table script">Copy</button></span></h3><pre class="code">${esc(tableScript)}</pre></div>` : ''}
          <div class="w-sec"><h3><span>Deploy and associate</span><span class="row-actions"><button class="btn sm" data-copy="${esc(deploy)}" data-label="deploy commands">Copy</button></span></h3><pre class="code">${esc(deploy)}</pre></div>
          ${r.tables.length ? kqlBlock(verify) : ''}

    /* =========================================================
       Firewall rule builder: FortiGate CLI, PAN-OS set commands, Azure NSG
       ========================================================= */
    const FGT_SVC = { 'tcp/443': 'HTTPS', 'tcp/80': 'HTTP', 'tcp/22': 'SSH', 'tcp/3389': 'RDP' };
    const PAN_SVC = { 'tcp/443': 'service-https', 'tcp/80': 'service-http' };
    const PAN_APP = { 'tcp/443': 'ssl', 'tcp/80': 'web-browsing', 'tcp/22': 'ssh', 'tcp/3389': 'ms-rdp', 'udp/53': 'dns', 'tcp/53': 'dns', 'udp/514': 'syslog', 'tcp/514': 'syslog', 'udp/123': 'ntp', 'tcp/389': 'ldap', 'tcp/636': 'ldap', 'tcp/88': 'kerberos', 'udp/88': 'kerberos', 'tcp/445': 'ms-ds-smb', 'tcp/25': 'smtp', 'icmp': 'icmp' };

    function parseAddr(tok) {
      const t = tok.trim(); if (!t) return null;
      if (/^any$/i.test(t)) return { kind: 'any', raw: t };
      let m;
      if ((m = t.match(/^(\d{1,3}(?:\.\d{1,3}){3})-(\d{1,3}(?:\.\d{1,3}){3})$/))) {
        const a = ipToInt(m[1]), b = ipToInt(m[2]); if (a === null || b === null || b < a) return { kind: 'bad', raw: t };

      }
      if ((m = t.match(/^(\d{1,3}(?:\.\d{1,3}){3})(?:\/(\d{1,2}))?$/))) {

        return { kind: p === 32 ? 'host' : 'net', raw: t, ip: intToIp(net), p, mask: intToIp(mask), fixed: net !== ip, name: p === 32 ? `H-${intToIp(net)}` : `N-${intToIp(net)}_${p}` };

    }
    function parseSvc(tok) {
      const t = tok.trim().toLowerCase(); if (!t) return null;
      if (t === 'any') return { kind: 'any', raw: t };
      if (t === 'icmp' || t === 'ping') return { kind: 'icmp', raw: t, key: 'icmp' };

      const port = a === b ? `${a}` : `${a}-${b}`;
      return { kind: 'port', raw: t, proto, a, b, port, key: `${proto}/${port}`, name: `${proto.toUpperCase()}-${port}` };
    }

      const out = $('#fwOut', w);
      const q = s => /[\s"]/.test(s) ? `"${s.replace(/"/g, '\\"')}"` : s;

      function build() {
        const lint = [], errs = [];
        const parseList = (s, fn) => s.split(/[,\n]+/).map(fn).filter(Boolean);
        const src = parseList(st.src, parseAddr), dst = parseList(st.dst, parseAddr), svc = parseList(st.svc, parseSvc);
        [...src, ...dst].filter(a => a.kind === 'bad').forEach(a => errs.push(`Can't read address <code>${esc(a.raw)}</code>.`));
        svc.filter(s => s.kind === 'bad').forEach(s => errs.push(`Can't read service <code>${esc(s.raw)}</code>. Use tcp/443, udp/514, tcp/8000-8080, icmp or any.`));
        [...src, ...dst].filter(a => a.fixed).forEach(a => lint.push(`<code>${esc(a.raw)}</code> has host bits set; normalised to <code>${a.ip}/${a.p}</code>.`));
        const tags = [...src, ...dst].filter(a => a.kind === 'tag');
        const name = (st.name.trim() || 'New-Rule').replace(/[^A-Za-z0-9_.\- ]/g, '').slice(0, 63);
        const allow = st.action === 'allow';
        const srcAny = !src.length || src.some(a => a.kind === 'any'), dstAny = !dst.length || dst.some(a => a.kind === 'any'), svcAny = !svc.length || svc.some(s => s.kind === 'any');

        const ports = svc.filter(s => s.kind === 'port');

        // lint
        if (allow && srcAny && dstAny && svcAny) lint.unshift('<b>Any / any / any allow.</b> This rule permits everything. Narrow at least one of source, destination or service.');
        else if (allow && srcAny && svcAny) lint.push('<b>Any source to any service.</b> Very broad for an allow rule.');
        if (allow && srcAny) ports.forEach(p => { for (const [pt, n] of Object.entries(RISKY_PORTS)) if (+pt >= p.a && +pt <= p.b) lint.push(`<b>${n} (${pt}) open to any source.</b> Restrict the source, or put it behind VPN or a bastion.`); });
        if (!st.log) lint.push('Logging is off. Without logs this rule is invisible to Sentinel and to troubleshooting.');
        if (!allow) lint.push('Deny rules only work <b>above</b> the allow rules they need to beat. Check the rule order after adding it.');
        if (st.nat && st.nsgDir === 'Inbound') lint.push('Source NAT is usually for outbound traffic. Check that this inbound rule really needs it.');
        if (tags.length) lint.push(`<code>${tags.map(t => esc(t.raw)).join(', ')}</code> looks like an Azure service tag. It's used as-is in the NSG and skipped on FortiGate and PAN-OS.`);

        // FortiGate
        const fgt = [];
        const fAddr = objs([...src, ...dst]).filter((a, i, arr) => arr.findIndex(x => x.name === a.name) === i);
        if (fAddr.length) {
          fgt.push('config firewall address');
          fAddr.forEach(a => {
            fgt.push(`    edit "${a.name}"`);
            if (a.kind === 'host' || a.kind === 'net') fgt.push(`        set subnet ${a.ip} ${a.mask}`);
            if (a.kind === 'range') fgt.push('        set type iprange', `        set start-ip ${a.a}`, `        set end-ip ${a.b}`);
            if (a.kind === 'fqdn') fgt.push('        set type fqdn', `        set fqdn "${a.raw}"`);

        if (fCustom.length) {
          fgt.push('config firewall service custom');
          fCustom.forEach(p => fgt.push(`    edit "${p.name}"`, `        set ${p.proto}-portrange ${p.port}`, '    next'));

        }

        const fSvc = svcAny ? '"ALL"' : [...ports.map(p => `"${FGT_SVC[p.key] || p.name}"`), ...(svc.some(s => s.kind === 'icmp') ? ['"ALL_ICMP"'] : [])].join(' ');
        fgt.push('config firewall policy', '    edit 0', `        set name "${name.slice(0, 35)}"`, `        set srcintf "${st.fgtIn || 'any'}"`, `        set dstintf "${st.fgtOut || 'any'}"`,

        if (allow && st.nat) fgt.push('        set nat enable');
        if (allow && st.sec) fgt.push('        set utm-status enable', '        set ssl-ssh-profile "certificate-inspection"', '        set av-profile "default"', '        set ips-sensor "default"');

        fgt.push('    next', 'end');
        if (name.length > 35) lint.push('FortiGate policy names are limited to 35 characters; the FortiGate name is trimmed.');

        // PAN-OS
        const pre = st.panDg.trim() ? `set device-group ${q(st.panDg.trim())} ` : 'set ';
        const rb = st.panDg.trim() ? 'pre-rulebase' : 'rulebase';
        const pan = [];
        objs([...src, ...dst]).filter((a, i, arr) => arr.findIndex(x => x.name === a.name) === i).forEach(a => {
          if (a.kind === 'host' || a.kind === 'net') pan.push(`${pre}address ${a.name} ip-netmask ${a.ip}/${a.p}`);
          if (a.kind === 'range') pan.push(`${pre}address ${a.name} ip-range ${a.a}-${a.b}`);
          if (a.kind === 'fqdn') pan.push(`${pre}address ${q(a.name)} fqdn ${a.raw}`);
        });
        const useApp = st.appid && !svcAny;
        const apps = useApp ? [...new Set([...ports.map(p => PAN_APP[p.key]), ...(svc.some(s => s.kind === 'icmp') ? ['icmp'] : [])])] : [];
        const appGap = useApp && apps.includes(undefined);
        if (!useApp || appGap) ports.filter(p => !PAN_SVC[p.key]).filter((p, i, arr) => arr.findIndex(x => x.name === p.name) === i).forEach(p => pan.push(`${pre}service ${p.name} protocol ${p.proto} port ${p.port}`));
        const pList = arr => arr.length === 1 ? arr[0] : `[ ${arr.join(' ')} ]`;
        const pAddr = arr => arr.some(a => a.kind === 'any') || !objs(arr).length ? 'any' : pList(objs(arr).map(a => q(a.name)));
        const R = `${pre}${rb} security rules ${q(name)}`;

        if (useApp && svc.some(s => s.kind === 'icmp') && ports.length === 0) { pApp = 'icmp'; pSvc = 'application-default'; }
        pan.push(`${R} from ${q(st.panFrom || 'any')} to ${q(st.panTo || 'any')}`, `${R} source ${pAddr(src)} destination ${pAddr(dst)}`,

        if (st.log) { pan.push(`${R} log-end yes`); if (st.panLog.trim()) pan.push(`${R} log-setting ${q(st.panLog.trim())}`); }
        if (allow && st.sec && st.panProfile.trim()) pan.push(`${R} profile-setting group ${q(st.panProfile.trim())}`);
        if (st.desc.trim()) pan.push(`${R} description "${st.desc.trim().replace(/"/g, "'")}"`);
        if (allow && st.nat) pan.push(`# Source NAT is a separate NAT rule on PAN-OS:`, `${pre}${rb} nat rules ${q(name + '-SNAT')} from ${q(st.panFrom || 'any')} to ${q(st.panTo || 'any')} source ${pAddr(src)} destination any service any source-translation dynamic-ip-and-port interface-address interface <egress-interface>`);
        pan.push(st.panDg.trim() ? 'commit\ncommit-all shared-policy device-group ' + q(st.panDg.trim()) : 'commit');

        const nsgAddr = arr => {

        if (allow && st.sec && dst.some(a => /monitor\.azure\.com|opinsights\.azure\.com|handler\.control/i.test(a.raw))) lint.push('These look like <b>Azure Monitor Agent</b> endpoints. Make sure no SSL/TLS decryption (deep inspection) applies to them; AMA breaks under HTTPS inspection.');
        if ([...src, ...dst].some(a => a.kind === 'range')) lint.push('NSG address prefixes take CIDRs or service tags. Convert the IP range to CIDRs before deploying.');
        const protos = [...new Set(svc.filter(s => s.kind !== 'bad').map(s => s.kind === 'port' ? s.proto : s.kind === 'icmp' ? 'icmp' : '*'))];
        const nsgProto = svcAny || protos.length > 1 ? '*' : { tcp: 'Tcp', udp: 'Udp', icmp: 'Icmp' }[protos[0]] || '*';
        if (protos.length > 1 && !svcAny) lint.push('The NSG rule mixes TCP and UDP, so protocol is set to <b>Any</b>. Split it into two rules if you want it exact.');

        return { fgt: fgt.join('\n'), pan: pan.join('\n'), nsg, testFgt, testPan, testNsg, lint, errs, name };
      }

      function run() {
        const r = build();
        const block = (title, sub, code, test, testLabel) => `
          <div class="w-sec vendor-out">
            <h3><span>${title} <span class="sub">${sub}</span></span><span class="row-actions"><button class="btn sm" data-copy="${esc(code)}" data-label="${esc(title)} config">Copy</button></span></h3>
            <pre class="code">${esc(code)}</pre>
            <details class="test"><summary>${testLabel}</summary><div class="cmd-h" style="margin-top:8px"><span></span><button class="btn sm" data-copy="${esc(test)}" data-label="${esc(title)} test">Copy</button></div><pre class="code">${esc(test)}</pre></details>
          </div>`;
        out.innerHTML = `
          ${r.errs.length ? `<div class="w-sec"><div class="err"><svg class="i"><use href="#i-warn"/></svg><span>${r.errs.join('<br>')}</span></div></div>` : ''}
          <div class="w-sec">
            <h3>Review</h3>
            ${r.lint.length ? `<ul class="gotchas">${r.lint.map(x => `<li><span>${x}</span></li>`).join('')}</ul>` : '<div class="summary" style="margin:0"><span class="pill g">No issues found</span></div>'}
          </div>
          ${block('FortiGate', 'FortiOS CLI', r.fgt, r.testFgt, 'Test with a debug flow trace')}
          ${block('Palo Alto', 'PAN-OS configure mode' + (st.panDg.trim() ? ' · Panorama' : ''), r.pan, r.testPan, 'Test with security-policy-match')}
          ${block('Azure NSG', 'Azure CLI', r.nsg, r.testNsg, 'Test with Network Watcher IP flow verify')}
          <div class="w-sec"><p class="hint-line" style="margin:0">Review before you paste into production. Object names are generated (H- host, N- network, R- range, FQDN-); rename them to your naming convention. FortiGate security profiles use the default profile names.</p></div>`;
      }

      w.addEventListener('input', e => { const k = e.target.dataset.k; if (k) { st[k] = e.target.value; run(); } });
      w.addEventListener('change', e => { const k = e.target.dataset.kb; if (k) { st[k] = e.target.checked; run(); } });
      w.addEventListener('click', e => {
        const s = e.target.closest('[data-fs]');
        if (s) {
          Object.assign(st, SAMPLES[s.dataset.fs]);
          w.querySelectorAll('[data-k]').forEach(i => i.value = st[i.dataset.k] ?? '');
          w.querySelectorAll('[data-kb]').forEach(i => i.checked = !!st[i.dataset.kb]);
          w.querySelectorAll('[data-fk]').forEach(seg => seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.fv === st[seg.dataset.fk])));
          return run();
        }
        const b = e.target.closest('[data-fk] button'); if (!b) return;
        const seg = b.parentElement; st[seg.dataset.fk] = b.dataset.fv;
        seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
        run();
      });
      run();
    }

    /* ---------- registry + routing ---------- */
    const TOOLS = [
      { id: 'cef', name: 'CEF parser', desc: 'Map CEF to CommonSecurityLog', icon: 't-cef', render: renderCef },
      { id: 'ama', name: 'AMA connectivity', desc: 'Endpoints, DNS, private link', icon: 't-ama', render: renderAma },
      { id: 'dcr', name: 'DCR builder', desc: 'AMA data collection rules', icon: 't-dcr', render: renderDcr },
      { id: 'fw', name: 'Firewall rule builder', desc: 'FortiGate, PAN-OS, NSG', icon: 't-fw', render: renderFw },
      { id: 'time', name: 'Time converter', desc: 'Epoch, ISO, FILETIME, KQL', icon: 't-time', render: renderTime },
      { id: 'cidr', name: 'CIDR calculator', desc: 'Subnets and IP-in-range', icon: 't-cidr', render: renderCidr },
      { id: 'jwt', name: 'JWT decoder', desc: 'Read Entra token claims', icon: 't-jwt', render: renderJwt },
      { id: 'encode', name: 'Encoder / decoder', desc: 'Base64, URL, hex, PS', icon: 't-enc', render: renderEnc }
    ];
    const side = $('#side'), work = $('#work');
    side.innerHTML = TOOLS.map(t => `<button class="tool-btn" role="tab" data-tool="${t.id}" aria-selected="false"><span class="ico"><svg aria-hidden="true"><use href="#${t.icon}"/></svg></span><span><b>${t.name}</b><small>${t.desc}</small></span></button>`).join('')
      + `<div class="side-note">More coming: IOC extractor, event ID lookup, KQL formatter.</div>`;
    function open(id, push = true) {
      const t = TOOLS.find(x => x.id === id) || TOOLS[0];
      side.querySelectorAll('.tool-btn').forEach(b => b.setAttribute('aria-selected', b.dataset.tool === t.id));
      t.render(work);
      document.title = `${t.name} · NoxCipher Tools`;
      if (push) { try { history.replaceState(null, '', '#' + t.id); } catch {} }
    }
    side.addEventListener('click', e => { const b = e.target.closest('.tool-btn'); if (b) { open(b.dataset.tool); if (innerWidth <= 900) work.scrollIntoView({ behavior: 'smooth', block: 'start' }); } });
    addEventListener('hashchange', () => open(location.hash.slice(1), false));
    open(location.hash.slice(1), false);
  })();
  </script>
</body>
</html>
